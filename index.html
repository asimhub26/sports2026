// ১. আপনার প্রি-প্রিন্টেড Circle Certificate-এর JPG/PNG ছবির GitHub Raw লিংক:
const CIRCLE_CERT_BG_URL = 'https://raw.githubusercontent.com/asimhub26/sports2026/main/circle_cert_bg.jpg';

// ২. Circle Certificate-এর পজিশন, ফন্ট সাইজ ও কালার কন্ট্রোল (এখান থেকেই সবকিছু নিজে পাল্টাতে পারবেন)
const CIRCLE_CERT_STYLE = {
  topMm: 95,          // পেজের একদম উপর থেকে প্রথম লাইনের দূরত্ব (mm) -> বাড়ালে নিচে নামবে, কমালে উপরে উঠবে
  lineGapMm: 12,      // প্রতিটি লাইনের মাঝের ফাঁকা (mm) -> বাড়ালে লাইনগুলো ছড়াবে, কমালে কাছাকাছি আসবে
  showCertify: true,  // true = "This is to certify that" প্রিন্ট হবে, false = হবে না
  showVenueDate: false, // true = নিচে Venue ও Date প্রিন্ট হবে, false = হবে না

  // ফন্ট সাইজ (pt)
  textSize: 15,       // সাধারণ লেখা ("This is to certify that", "of", "has secured" ইত্যাদি)
  nameSize: 22,       // ছাত্র/ছাত্রীর নাম
  schoolSize: 16,     // স্কুলের নাম ও জোন
  groupSize: 15,      // Group ও Gender
  eventSize: 17,      // ইভেন্টের নাম
  positionSize: 17,   // পজিশন (1st / 2nd / 3rd)

  // রঙ (যেকোনো Hex কালার কোড বসাতে পারেন)
  textColor: '#1E293B',     // সাধারণ লেখা (গাঢ় ধূসর/কালো)
  nameColor: '#C62828',     // ছাত্র/ছাত্রীর নাম (লাল / Red)
  schoolColor: '#1B5E20',   // স্কুলের নাম (সবুজ / Green)
  positionColor: '#D97706', // পজিশন (গাঢ় অরেঞ্জ/গোল্ড)
  groupColor: '#6A1B9A',    // Group ও Gender (বেগুনি / Purple)
  eventColor: '#1565C0'     // ইভেন্টের নাম (নীল / Blue)
};

async function pageCerts() {
  const wide = isWide();
  let level = 'zone', zoneKey = wide ? (S.viewZone || ZONES[0].key) : S.profile.zone;
  let withGraphics = false; // ডিফল্ট Unchecked (শুধু ক্যান্ডিডেট ইনফরমেশন প্রিন্ট হবে)
  const root = h('div'), head = h('div', { class: 'toolbar' }), box = h('div'), set = h('div');
  root.append(head, box, set);
  setMain(root, 'Certificates');
  const picked = new Set();
  let printedSet = new Set();
  let certSettings = {
    topMm: CIRCLE_CERT_STYLE.topMm,
    gapMm: CIRCLE_CERT_STYLE.lineGapMm,
    nameSize: CIRCLE_CERT_STYLE.nameSize,
    textSize: CIRCLE_CERT_STYLE.textSize,
    showCertify: CIRCLE_CERT_STYLE.showCertify
  };
  let venuesList = [];
  let cachedBgDataUrl = null;

  // প্রতিটি সার্টিফিকেটের ইউনিক কী (রেজাল্ট বদলে নতুন নাম এলে সেটি অটোমেটিক Not Printed দেখাবে)
  const certKey = x => x.n + '|' + String(x.name || '').trim().toUpperCase();

  /* ===== OPTION 1: LOCAL STORAGE (একটি ল্যাপটপের জন্য — সুপার ফাস্ট, বর্তমানে ACTIVE) ===== */
  async function loadPrintedSet(lvl, zKey) {
    try {
      const raw = localStorage.getItem('kw_cert_printed_' + (lvl === 'circle' ? 'CIRCLE' : zKey));
      return new Set(raw ? JSON.parse(raw) : []);
    } catch (e) { return new Set(); }
  }
  async function savePrintedSet(lvl, zKey, setObj) {
    try {
      localStorage.setItem('kw_cert_printed_' + (lvl === 'circle' ? 'CIRCLE' : zKey), JSON.stringify([...setObj]));
    } catch (e) {}
  }
  /* ===== END OPTION 1 ===== */

  /* ===== OPTION 2: GOOGLE SHEET SYNC (একাধিক ডিভাইসের জন্য — চালু করতে উপরের Option 1 কমেন্ট করে এর কমেন্ট তুলুন) =====
  async function loadPrintedSet(lvl, zKey) {
    try {
      const arr = await call('apiGetPrintedCerts', lvl, zKey);
      return new Set(Array.isArray(arr) ? arr : []);
    } catch (e) { return new Set(); }
  }
  async function savePrintedSet(lvl, zKey, setObj) {
    try {
      await call('apiSavePrintedCerts', lvl, zKey, [...setObj]);
    } catch (e) { toast('Printed status সেভ হয়নি: ' + e.message, 'error'); }
  }
  ===== END OPTION 2 ===== */

  function hexToRgb(hex) {
    const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(String(hex || '#111111').trim());
    return m ? [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)] : [17, 17, 17];
  }

  function loadImageDataUrl(url) {
    if (cachedBgDataUrl) return Promise.resolve(cachedBgDataUrl);
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        try {
          const cv = document.createElement('canvas');
          cv.width = img.naturalWidth;
          cv.height = img.naturalHeight;
          cv.getContext('2d').drawImage(img, 0, 0);
          cachedBgDataUrl = cv.toDataURL('image/jpeg', 0.92);
          resolve(cachedBgDataUrl);
        } catch (err) { reject(err); }
      };
      img.onerror = () => reject(new Error('Background image load failed'));
      img.src = url + (url.includes('?') ? '&' : '?') + 't=' + Date.now();
    });
  }

  function drawCenteredSegments(pdf, segs, cx, y) {
    let totalW = 0;
    const measured = segs.map(s => {
      pdf.setFont('times', s.style || 'normal');
      pdf.setFontSize(s.size);
      const w = pdf.getTextWidth(s.text);
      totalW += w;
      return Object.assign({}, s, { w });
    });
    let x = cx - totalW / 2;
    measured.forEach(s => {
      const [r, g, b] = hexToRgb(s.color);
      pdf.setFont('times', s.style || 'normal');
      pdf.setFontSize(s.size);
      pdf.setTextColor(r, g, b);
      pdf.text(s.text, x, y);
      x += s.w;
    });
  }

  function findVenueInfo(lvl, zKey) {
    const want = (lvl === 'circle' ? 'KHANAKUL WEST CIRCLE' : String(zKey || '').toUpperCase()).trim();
    const hit = (venuesList || []).find(v => String(v.zone || '').trim().toUpperCase() === want);
    return hit ? { venue: hit.venue || '', date: hit.date ? fmtDateDisplay(hit.date) : '' } : { venue: '', date: '' };
  }

  function liveCircleSettings() {
    const readNum = (id, fallback) => {
      const el = $('#' + id);
      return el && el.value !== '' && !isNaN(Number(el.value)) ? Number(el.value) : fallback;
    };
    const showEl = $('#cs_show');
    return {
      topMm: readNum('cs_topMm', certSettings.topMm || CIRCLE_CERT_STYLE.topMm),
      gapMm: readNum('cs_gapMm', certSettings.gapMm || CIRCLE_CERT_STYLE.lineGapMm),
      nameSize: readNum('cs_nameSize', certSettings.nameSize || CIRCLE_CERT_STYLE.nameSize),
      textSize: readNum('cs_textSize', certSettings.textSize || CIRCLE_CERT_STYLE.textSize),
      showCertify: showEl ? showEl.checked : (certSettings.showCertify !== false)
    };
  }

  function buildCircleLines(x, cs, ven) {
    const ST = CIRCLE_CERT_STYLE;
    const lines = [];
    // লাইন ১: This is to certify that [NAME]
    const l1 = [];
    if (cs.showCertify) {
      l1.push({ text: 'This is to certify that  ', size: cs.textSize, color: ST.textColor, style: 'italic' });
    }
    l1.push({ text: String(x.name || ''), size: cs.nameSize, color: ST.nameColor, style: 'bold' });
    lines.push(l1);

    // লাইন ২: of [SCHOOL NAME (Zone)]
    lines.push([
      { text: 'of  ', size: cs.textSize, color: ST.textColor, style: 'normal' },
      { text: (x.schoolName || '') + (x.zoneLabel ? ' (' + x.zoneLabel + ' Zone)' : ''), size: ST.schoolSize, color: ST.schoolColor, style: 'bold' }
    ]);

    // লাইন ৩: has secured [1st] position in [Group A BOYS] — [100M RUN]
    lines.push([
      { text: 'has secured  ', size: cs.textSize, color: ST.textColor, style: 'normal' },
      { text: String(x.position || ''), size: ST.positionSize, color: ST.positionColor, style: 'bold' },
      { text: '  position in  ', size: cs.textSize, color: ST.textColor, style: 'normal' },
      { text: 'Group ' + (x.group || '') + ' ' + (x.gender || ''), size: ST.groupSize, color: ST.groupColor, style: 'bold' },
      { text: '  —  ', size: cs.textSize, color: ST.textColor, style: 'normal' },
      { text: String(x.event || ''), size: ST.eventSize, color: ST.eventColor, style: 'bold' }
    ]);

    // লাইন ৪ (ঐচ্ছিক): Venue ও Date
    if (ST.showVenueDate && (ven.venue || ven.date)) {
      lines.push([
        { text: [ven.venue ? 'Venue: ' + ven.venue : '', ven.date ? 'Date: ' + ven.date : ''].filter(Boolean).join('   |   '), size: Math.max(10, cs.textSize - 2), color: ST.textColor, style: 'normal' }
      ]);
    }
    return lines;
  }

  function printCertificates(list, lvl, zKey, labelText, onDone) {
    if (!list.length) return toast('প্রিন্ট করার মতো কোনো সার্টিফিকেট নেই।', 'error');
    const ven = findVenueInfo(lvl, zKey);
    const pr = $('#printRoot');
    const isCircle = lvl === 'circle';
    const cs = isCircle ? liveCircleSettings() : null;

    // Zone এবং Circle দুটোই A4 Landscape
    $('#pageStyle').textContent = '@page{size:A4 landscape;margin:0}';

    pr.replaceChildren(...list.map(x => {
      if (isCircle) {
        const lines = buildCircleLines(x, cs, ven);
        let y = cs.topMm;
        const lineNodes = lines.map(segs => {
          const row = h('div', {
            style: { position: 'absolute', left: '16mm', right: '16mm', top: y + 'mm', lineHeight: '1.35' }
          }, segs.map(s => h('span', {
            style: {
              fontSize: s.size + 'pt',
              color: s.color,
              fontWeight: s.style === 'bold' ? '700' : '400',
              fontStyle: s.style === 'italic' ? 'italic' : 'normal'
            }
          }, s.text)));
          y += cs.gapMm;
          return row;
        });

        return h('div', { class: 'cert-page cert-circle' },
          withGraphics ? h('img', { class: 'cc-bg', src: CIRCLE_CERT_BG_URL, alt: '' }) : null,
          h('div', { class: 'cc-layer' }, lineNodes)
        );
      }

      // Zone Certificate (ডিফল্ট ডিজাইন অপরিবর্তিত)
      const zoneTitle = (labelText || zoneLabel(zKey) || '').toUpperCase();
      return h('div', { class: 'cert-page cert-zone' },
        h('div', { class: 'cert-zone-frame' },
          h('div', null,
            h('div', { class: 'cz-top' }, 'KHANAKUL WEST CIRCLE ANNUAL SPORTS - 2026'),
            h('div', { class: 'cz-sub' }, 'ZONE LEVEL SPORTS — ' + zoneTitle),
            h('div', { class: 'cz-title' }, 'CERTIFICATE OF MERIT')
          ),
          h('div', { class: 'cz-body' },
            'This is to certify that ',
            h('span', { class: 'cz-name' }, x.name || ''),
            h('br'),
            'of ',
            h('span', { class: 'cz-val' }, x.schoolName || ''),
            h('br'),
            'has secured ',
            h('span', { class: 'cz-val' }, x.position || ''),
            ' position in ',
            h('span', { class: 'cz-val' }, 'Group ' + (x.group || '') + ' ' + (x.gender || '') + ' — ' + (x.event || '')),
            (ven.venue || ven.date) ? h('div', { class: 'cz-meta' },
              [ven.venue ? 'Venue: ' + ven.venue : '', ven.date ? 'Date: ' + ven.date : ''].filter(Boolean).join('   ·   ')
            ) : null
          ),
          h('div', { class: 'cz-sigs' },
            h('div', { class: 'cz-sig' }, 'Convener / Zone Admin'),
            h('div', { class: 'cz-sig' }, 'Secretary, Circle Sports')
          )
        )
      );
    }));

    document.body.classList.add('printing');
    let finished = false;
    const done = () => {
      if (finished) return;
      finished = true;
      document.body.classList.remove('printing');
      pr.replaceChildren();
      window.removeEventListener('afterprint', done);
      if (onDone) onDone();
    };
    window.addEventListener('afterprint', done);
    window.print();
    setTimeout(done, 2000);
  }

  async function downloadCertificatesPdf(list, lvl, zKey, labelText, onDone) {
    if (!list.length) return toast('ডাউনলোড করার মতো কোনো সার্টিফিকেট নেই।', 'error');

    try {
      await loadArchivePdfLibs();

      return toast('PDF লাইব্রেরি লোড করা যায়নি। দয়া করে Print বাটন ব্যবহার করে Save as PDF করুন।', 'error');
    }
    const { jsPDF } = window.jspdf;
    const isCircle = lvl === 'circle';
    const ven = findVenueInfo(lvl, zKey);
    const cs = isCircle ? liveCircleSettings() : null;

    let bgData = null;
    if (isCircle && withGraphics) {
      try {
        bgData = await loadImageDataUrl(CIRCLE_CERT_BG_URL);
      } catch (e) {
        toast('⚠️ Graphics ছবিটি (circle_cert_bg.jpg) লোড হয়নি, শুধু টেক্সট দিয়ে PDF তৈরি হচ্ছে।', 'error');
      }
    }

    // Zone এবং Circle দুটোই A4 Landscape
    const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });

    list.forEach((x, idx) => {
      if (idx > 0) pdf.addPage('a4', 'landscape');
      const pw = pdf.internal.pageSize.getWidth();
      const ph = pdf.internal.pageSize.getHeight();
      const cx = pw / 2;

      if (isCircle) {
        if (bgData) pdf.addImage(bgData, 'JPEG', 0, 0, pw, ph);
        const lines = buildCircleLines(x, cs, ven);
        let y = cs.topMm;
        lines.forEach(segs => {
          drawCenteredSegments(pdf, segs, cx, y);
          y += cs.gapMm;
        });
      } else {
        // Zone Certificate (ডিফল্ট ডিজাইন অপরিবর্তিত)
        pdf.setDrawColor(31, 107, 74);
        pdf.setLineWidth(1.4);
        pdf.rect(12, 12, pw - 24, ph - 24);
        pdf.setDrawColor(212, 154, 26);
        pdf.setLineWidth(0.7);
        pdf.rect(16, 16, pw - 32, ph - 32);

        pdf.setFont('times', 'bold');
        pdf.setFontSize(17);
        pdf.setTextColor(15, 61, 43);
        pdf.text('KHANAKUL WEST CIRCLE ANNUAL SPORTS - 2026', cx, 36, { align: 'center' });

        pdf.setFontSize(13);
        pdf.setTextColor(31, 107, 74);
        pdf.text('ZONE LEVEL SPORTS — ' + String(labelText || zoneLabel(zKey) || '').toUpperCase(), cx, 46, { align: 'center' });

        pdf.setFontSize(28);
        pdf.setTextColor(184, 134, 11);
        pdf.text('CERTIFICATE OF MERIT', cx, 66, { align: 'center' });

        pdf.setFont('times', 'italic');
        pdf.setFontSize(14);
        pdf.setTextColor(40, 40, 40);
        pdf.text('This is to certify that', cx, 84, { align: 'center' });

        pdf.setFont('times', 'bold');
        pdf.setFontSize(22);
        pdf.setTextColor(15, 61, 43);
        pdf.text(String(x.name || ''), cx, 98, { align: 'center' });

        pdf.setFont('times', 'normal');
        pdf.setFontSize(14);
        pdf.setTextColor(30, 30, 30);
        pdf.text('of  ' + String(x.schoolName || ''), cx, 112, { align: 'center' });

        pdf.setFont('times', 'bold');
        pdf.setFontSize(15);
        pdf.text('has secured  ' + String(x.position || '') + '  Position in  Group ' + String(x.group || '') + ' ' + String(x.gender || '') + ' — ' + String(x.event || ''), cx, 128, { align: 'center' });

        if (ven.venue || ven.date) {
          pdf.setFont('times', 'normal');
          pdf.setFontSize(12);
          pdf.setTextColor(70, 70, 70);
          pdf.text([ven.venue ? 'Venue: ' + ven.venue : '', ven.date ? 'Date: ' + ven.date : ''].filter(Boolean).join('   |   '), cx, 144, { align: 'center' });
        }

        pdf.setDrawColor(60, 60, 60);
        pdf.setLineWidth(0.4);
        pdf.line(36, 174, 106, 174);
        pdf.line(pw - 106, 174, pw - 36, 174);
        pdf.setFont('times', 'normal');
        pdf.setFontSize(12);
        pdf.setTextColor(30, 30, 30);
        pdf.text('Convener / Zone Admin', 71, 181, { align: 'center' });
        pdf.text('Secretary, Circle Sports', pw - 71, 181, { align: 'center' });
      }
    });

    const fname = 'Certificates_' + (isCircle ? ('Circle' + (withGraphics ? '_WithGraphics' : '')) : String(labelText || zKey).replace(/[^A-Za-z0-9]+/g, '_')) + '.pdf';
    pdf.save(fname);
    toast(list.length + ' certificate(s) PDF ready.', 'ok');
    if (onDone) onDone();
  }

  async function load() {
    head.replaceChildren();
    set.replaceChildren();

// এখানে আপনার চালু হওয়া GitHub Raw লিংকটি বসান (শেষে '/' রাখবেন)
const ARCHIVE_BASE = 'https://raw.githubusercontent.com/asimhub26/sports2026/refs/heads/main/';

const ARCHIVE_YEARS = ['2025'];

const ARCHIVE_ZONES = [
  'Thakuranichak 1', 'Thakuranichak 2', 'Ghoshpur Uttar',
  'Ghoshpur Madhya', 'Ghoshpur Paschim', 'Kishorepur 1', 'Kishorepur 2'
];

const ARCHIVE_CACHE = {};

function parseArchiveCSV(text) {
  text = text.replace(/^\uFEFF/, '');
  const rows = [];
  let row = [], cur = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i], next = text[i + 1];
    if (inQ) {
      if (ch === '"' && next === '"') { cur += '"'; i++; }
      else if (ch === '"') { inQ = false; }
      else { cur += ch; }
    } else {
      if (ch === '"') { inQ = true; }
      else if (ch === ',') { row.push(cur.trim()); cur = ''; }
      else if (ch === '\r' && next === '\n') { row.push(cur.trim()); rows.push(row); row = []; cur = ''; i++; }
      else if (ch === '\n' || ch === '\r') { row.push(cur.trim()); rows.push(row); row = []; cur = ''; }
      else { cur += ch; }
    }
  }
  if (cur !== '' || row.length) { row.push(cur.trim()); rows.push(row); }
  const clean = rows.filter(r => r.some(c => c !== ''));
  if (clean.length < 2) return [];
  const hdrs = clean[0];
  return clean.slice(1).map(r => {
    const o = {};
    hdrs.forEach((k, idx) => { o[k] = r[idx] != null ? r[idx] : ''; });
    return o;
  });
}

async function fetchArchiveCSV(year, prefix) {
  const filename = prefix + '_' + year + '.csv';
  if (ARCHIVE_CACHE[filename]) return ARCHIVE_CACHE[filename];
  const res = await fetch(ARCHIVE_BASE + filename);
  if (res.status === 404) return null;
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = parseArchiveCSV(await res.text());
  ARCHIVE_CACHE[filename] = data;
  return data;
}

function calcArchivePoints(rows, groupField) {
  const map = {};
  rows.forEach(r => {
    const name = (r[groupField] || '').trim();
    if (!name || !r.Name) return;
    const key = name.toUpperCase();
    if (!map[key]) {
      const label = (groupField === 'School' && r['School No']) ? (r['School No'] + ' - ' + name) : name;
      map[key] = { label, first: 0, second: 0, third: 0, points: 0 };
    }
    if (r.Position === '1st') { map[key].first++; map[key].points += 5; }
    else if (r.Position === '2nd') { map[key].second++; map[key].points += 3; }
    else if (r.Position === '3rd') { map[key].third++; map[key].points += 1; }
  });
  const list = Object.values(map).sort((a, b) =>
    b.points - a.points || b.first - a.first || b.second - a.second || b.third - a.third || a.label.localeCompare(b.label)
  );
  list.forEach((item, i) => {
    const prev = list[i - 1];
    const tied = prev && prev.points === item.points && prev.first === item.first && prev.second === item.second && prev.third === item.third;
    item.rank = tied ? prev.rank : (i + 1);
    item.shared = tied;
    if (tied) prev.shared = true;
  });
  return list;
}

function escArchiveHtml(v) {
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function exportArchiveExcel(title, subtitle, cols, rows, filename) {
  if (!rows.length) return;
  let html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">'
    + '<head><meta charset="UTF-8"><style>'
    + 'table{border-collapse:collapse;font-family:Arial,sans-serif;font-size:11pt;}'
    + 'th,td{border:1px solid #444;padding:5px 8px;mso-number-format:"\\@";}'
    + 'th{background:#14532d;color:#fff;font-weight:bold;}'
    + '.ttl{font-size:14pt;font-weight:bold;text-align:center;border:none;padding:6px;}'
    + '.sub{font-size:10pt;text-align:center;border:none;padding:2px 6px 8px;color:#333;}'
    + '</style></head><body><table>'
    + '<tr><td class="ttl" colspan="' + cols.length + '">' + escArchiveHtml(title) + '</td></tr>'
    + (subtitle ? '<tr><td class="sub" colspan="' + cols.length + '">' + escArchiveHtml(subtitle) + '</td></tr>' : '')
    + '<thead><tr>' + cols.map(c => '<th>' + escArchiveHtml(c) + '</th>').join('') + '</tr></thead><tbody>'
    + rows.map(r => '<tr>' + r.map(v => '<td>' + escArchiveHtml(v) + '</td>').join('') + '</tr>').join('')
    + '</tbody></table></body></html>';

  const blob = new Blob(['\uFEFF' + html], { type: 'application/vnd.ms-excel;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename.replace(/[^a-zA-Z0-9_-]+/g, '_') + '.xls';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
}

let ARCHIVE_PDF_LIBS = null;

function loadScriptTry(urls) {
  return new Promise((resolve, reject) => {
    let i = 0;
    const next = () => {
      if (i >= urls.length) return reject(new Error('Script load failed'));
      const s = document.createElement('script');
      s.src = urls[i++];
      s.onload = resolve;
      s.onerror = () => { s.remove(); next(); };
      document.head.appendChild(s);
    };
    next();
  });
}

function isPdfLibReady() {
  return !!(window.jspdf && window.jspdf.jsPDF && window.jspdf.jsPDF.API && window.jspdf.jsPDF.API.autoTable);
}

function loadArchivePdfLibs() {
  if (isPdfLibReady()) return Promise.resolve();
  if (ARCHIVE_PDF_LIBS) return ARCHIVE_PDF_LIBS;
  ARCHIVE_PDF_LIBS = loadScriptTry([
    'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'
  ]).then(() => loadScriptTry([
    'https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js'
  ])).catch(err => { ARCHIVE_PDF_LIBS = null; throw err; });
  return ARCHIVE_PDF_LIBS;
}

function drawBnCell(pdf, data) {
  const txt = String(data.cell.raw || '').trim();
  if (!txt) return;
  const cw = Math.max(data.cell.width - 2, 4);
  const ch = Math.max(data.cell.height - 1, 3);
  const scale = 10;
  const cv = document.createElement('canvas');
  cv.width = Math.ceil(cw * scale);
  cv.height = Math.ceil(ch * scale);
  const ctx = cv.getContext('2d');
  let fs = Math.min(26, Math.floor(cv.height * 0.62));
  ctx.font = fs + 'px "Noto Sans Bengali", Arial, sans-serif';
  const tw = ctx.measureText(txt).width;
  if (tw > cv.width - 4) {
    fs = Math.max(12, Math.floor(fs * ((cv.width - 4) / tw)));
    ctx.font = fs + 'px "Noto Sans Bengali", Arial, sans-serif';
  }
  ctx.fillStyle = '#111111';
  ctx.textBaseline = 'middle';
  ctx.fillText(txt, 2, cv.height / 2);
  pdf.addImage(cv.toDataURL('image/png'), 'PNG', data.cell.x + 1, data.cell.y + 0.5, cw, ch);
}

function makePdfBtn(onClick) {
  // পেজ খোলার সাথে সাথেই ব্যাকগ্রাউন্ডে লাইব্রেরি রেডি হয়ে থাকবে
  loadArchivePdfLibs().catch(() => {});

  const b = h('button', {
    class: 'btn small',
    type: 'button',
    onclick: () => {
      if (b.disabled) return;
      const run = () => {
        try {
          onClick();
        } catch (err) {
          alert('PDF Error: ' + (err && err.message ? err.message : err));
        }
      };
      if (isPdfLibReady()) {
        run();
      } else {
        const old = b.textContent;
        b.disabled = true;
        b.textContent = 'Loading...';
        loadArchivePdfLibs()
          .then(run)
          .catch(err => alert('PDF লাইব্রেরি লোড হয়নি: ' + (err && err.message ? err.message : err)))
          .finally(() => { b.disabled = false; b.textContent = old; });
      }
    }
  }, 'PDF');
  b.style.cssText = 'background:#dc2626 !important; color:#fff !important; border-color:#dc2626 !important;';
  return b;
}

function exportArchivePDF(title, subtitle, cols, rows, filename, landscape) {
  if (!rows || !rows.length) {
    alert('ডাউনলোড করার মতো কোনো ডেটা নেই।');
    return;
  }
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({
    orientation: landscape ? 'landscape' : 'portrait',
    unit: 'mm',
    format: 'a4'
  });

  const pageW = pdf.internal.pageSize.getWidth();
  const pageH = pdf.internal.pageSize.getHeight();
  const HAS_BN = /[\u0980-\u09FF]/;

  pdf.setFont('helvetica', 'bold');
  pdf.setFontSize(13);
  pdf.setTextColor(20, 83, 45);
  pdf.text(String(title || 'Archive'), pageW / 2, 12, { align: 'center' });

  let startY = 17;
  if (subtitle) {
    pdf.setFont('helvetica', 'normal');
    pdf.setFontSize(9);
    pdf.setTextColor(70);
    pdf.text(String(subtitle), pageW / 2, 17, { align: 'center' });
    startY = 22;
  }

  const bodyRows = rows.map(r => r.map(v => String(v == null ? '' : v)));

  pdf.autoTable({
    startY: startY,
    head: [cols],
    body: bodyRows,
    margin: { left: 8, right: 8, top: 12, bottom: 10 },
    styles: {
      fontSize: 8,
      cellPadding: 2,
      overflow: 'linebreak',
      lineColor: [180, 180, 180],
      lineWidth: 0.2
    },
    headStyles: { fillColor: [20, 83, 45], textColor: 255, fontStyle: 'bold' },
    alternateRowStyles: { fillColor: [248, 250, 252] },
    willDrawCell: function (data) {
      if (data.section === 'body' && HAS_BN.test(String(data.cell.raw || ''))) {
        data.cell.text = [''];
      }
    },
    didDrawCell: function (data) {
      if (data.section === 'body' && HAS_BN.test(String(data.cell.raw || ''))) {
        drawBnCell(pdf, data);
      }
    }
  });

  const total = pdf.internal.getNumberOfPages();
  for (let p = 1; p <= total; p++) {
    pdf.setPage(p);
    pdf.setFontSize(8);
    pdf.setTextColor(100);
    pdf.text('Page ' + p + ' of ' + total, pageW - 8, pageH - 5, { align: 'right' });
  }

  const safeName = (filename || 'Archive_Report').replace(/[^a-zA-Z0-9_-]+/g, '_') + '.pdf';
  const blob = pdf.output('blob');
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = safeName;
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 10000);
}

async function pageArchive() {
  const root = h('div');
  setMain(root, 'Archive');

  const views = [
    ['zone_list',     'Zone List'],
    ['zone_result',   'Zone Result'],
    ['zone_points',   'Zone Points'],
    ['circle_list',   'Circle List'],
    ['circle_result', 'Circle Result'],
    ['circle_points', 'Circle Points'],
    ['subdiv_list',   'Subdivision List']
  ];

  let year = ARCHIVE_YEARS[0];
  let view = 'circle_result';
  let zone = ARCHIVE_ZONES[0];

  const zoneWrap = h('span', { style: { display: 'none', gap: '6px', alignItems: 'center' } },
    h('label', null, 'Zone'),
    select(ARCHIVE_ZONES.map(z => [z, z]), zone, v => { zone = v; render(); })
  );

  const topBar = h('div', { class: 'toolbar' },
    h('label', null, 'Year'),
    select(ARCHIVE_YEARS.map(y => [y, y]), year, v => { year = v; render(); }),
    h('label', null, 'Section'),
    select(views, view, v => { view = v; render(); }),
    zoneWrap
  );

  const area = h('div');
  root.append(topBar, area);

  async function render() {
    const needZone = view.startsWith('zone_');
    zoneWrap.style.display = needZone ? 'inline-flex' : 'none';

    const viewLabel = (views.find(v => v[0] === view) || ['', 'Archive'])[1];
    const baseTitle = 'Khanakul West Circle Sports ' + year + ' - ' + viewLabel + (needZone ? ' (' + zone + ')' : '');
    const fileBase = 'Sports_' + year + '_' + view + (needZone ? '_' + zone : '');

    if (ARCHIVE_BASE.includes('YOUR_USER')) {
      area.replaceChildren(h('div', { class: 'note bad' }, 'ARCHIVE_BASE-এ আপনার GitHub Raw লিংক বসান।'));
      return;
    }

    const prefixMap = {
      zone_list:     'zone_list',
      zone_result:   'zone_result',
      zone_points:   'zone_result',
      circle_list:   'circle_list',
      circle_result: 'circle_result',
      circle_points: 'circle_result',
      subdiv_list:   'subdivision_list'
    };

    area.replaceChildren(h('div', { class: 'note' }, 'Loading ' + year + ' archive...'));

    let allRows;
    try {
      allRows = await fetchArchiveCSV(year, prefixMap[view]);
    } catch (err) {
      area.replaceChildren(h('div', { class: 'note bad' }, 'ডেটা লোড করা যায়নি। ইন্টারনেট সংযোগ চেক করুন।'));
      return;
    }

    if (!allRows) {
      area.replaceChildren(emptyNote('Data not found (' + year + ' record is not available).'));
      return;
    }

    const scoped = needZone ? allRows.filter(r => r.Zone === zone) : allRows;

    if (!scoped.length) {
      const msg = needZone
        ? 'Data not found (' + zone + ' - ' + year + ' data is not available).'
        : 'Data not found.';
      area.replaceChildren(emptyNote(msg));
      return;
    }

    // Points ভিউ (Zone Points বা Circle Points)
    if (view === 'zone_points' || view === 'circle_points') {
      const isZone = view === 'zone_points';
      const ranked = calcArchivePoints(scoped, isZone ? 'School' : 'Zone');
      if (!ranked.length) {
        area.replaceChildren(emptyNote('Data not found (' + zone + ' - ' + year + ' points not available).'));
        return;
      }

      const ptCols = ['Rank', isZone ? 'School' : 'Zone', '1st', '2nd', '3rd', 'Points'];
      const ptRows = ranked.map(r => [r.rank + (r.shared ? '=' : ''), r.label, r.first, r.second, r.third, r.points]);
      const ptNote = 'Points: 1st = 5, 2nd = 3, 3rd = 1';

      const actionBar = h('div', { class: 'toolbar' },
       makePdfBtn(() => exportArchivePDF(baseTitle, ptNote, ptCols, ptRows, fileBase, false)),
        h('button', { class: 'btn small', type: 'button', onclick: () => exportArchiveExcel(baseTitle, ptNote, ptCols, ptRows, fileBase) }, 'Excel')
      );

      const tbody = h('tbody', null, ranked.map(r =>
        h('tr', null,
          h('td', null, r.rank + (r.shared ? '=' : '')),
          h('td', null, r.label),
          h('td', null, r.first),
          h('td', null, r.second),
          h('td', null, r.third),
          h('td', null, h('b', null, r.points))
        )
      ));
      area.replaceChildren(
        actionBar,
        h('div', { class: 'note ok' }, year + ' Points: 1st = 5, 2nd = 3, 3rd = 1. Equal points are ranked by more 1st places, then 2nd, then 3rd.'),
        h('div', { class: 'tw' }, h('table', { class: 't' },
          h('thead', null, h('tr', null, ptCols.map(x => h('th', null, x)))),
          tbody
        ))
      );
      return;
    }

    // List ও Result ভিউ
    const isResult = view.endsWith('_result');
    const showZoneCol = !needZone;
    const f = { q: '', zone: '', group: '', gender: '', event: '', pos: '' };
    const groups = [...new Set(scoped.map(r => r.Group).filter(Boolean))].sort();
    const events = [...new Set(scoped.map(r => r.Event).filter(Boolean))];
    const zonesInData = showZoneCol ? [...new Set(scoped.map(r => r.Zone).filter(Boolean))].sort() : [];
    const tbody = h('tbody');
    const countEl = h('small', { style: { marginLeft: 'auto', fontWeight: '600' } });

    const cols = ['Sl', 'Group', 'Gender', 'Event']
      .concat(isResult ? ['Position'] : [])
      .concat(['Chest No', 'Name', "Father's Name", 'DOB', 'Class', 'School'])
      .concat(showZoneCol ? ['Zone'] : []);

    let currentRows = [];

    const getSubtitle = () => {
      const parts = [];
      if (f.zone) parts.push('Zone: ' + f.zone);
      if (f.group) parts.push('Group: ' + f.group);
      if (f.gender) parts.push('Gender: ' + f.gender);
      if (f.event) parts.push('Event: ' + f.event);
      if (isResult && f.pos) parts.push('Position: ' + f.pos);
      if (f.q.trim()) parts.push('Search: ' + f.q.trim());
      parts.push('Total: ' + currentRows.length);
      return parts.join(' | ');
    };

    const fill = () => {
      let n = 0;
      const trs = [];
      currentRows = [];
      scoped.forEach(r => {
        if (f.zone && r.Zone !== f.zone) return;
        if (f.group && r.Group !== f.group) return;
        if (f.gender && r.Gender !== f.gender) return;
        if (f.event && r.Event !== f.event) return;
        if (isResult && f.pos && r.Position !== f.pos) return;
        if (f.q && ![r.Name, r["Father's Name"], r.School, r['School No'], r['Chest No'], r.Zone, r.Event].join(' ').toLowerCase().includes(f.q.toLowerCase())) return;
        n++;
        const schoolDisp = (r['School No'] ? r['School No'] + ' - ' : '') + (r.School || '');

        const exportRow = [n, r.Group, r.Gender, r.Event];
        if (isResult) exportRow.push(r.Position);
        exportRow.push(r['Chest No'] || '', r.Name, r["Father's Name"], r.DOB, r.Class, schoolDisp);
        if (showZoneCol) exportRow.push(r.Zone);
        currentRows.push(exportRow);

        const cells = [
          h('td', null, n),
          h('td', null, r.Group),
          h('td', null, r.Gender),
          h('td', null, r.Event)
        ];
        if (isResult) cells.push(h('td', null, r.Position));
        cells.push(
          h('td', null, r['Chest No'] ? h('span', { class: 'chest' }, r['Chest No']) : '–'),
          h('td', null, r.Name),
          h('td', null, r["Father's Name"]),
          h('td', null, fmtDateDisplay(r.DOB)),
          h('td', null, r.Class),
          h('td', null, schoolDisp)
        );
        if (showZoneCol) cells.push(h('td', null, r.Zone));
        trs.push(h('tr', null, cells));
      });
      countEl.textContent = 'Showing ' + n + ' of ' + scoped.length;
      if (!trs.length) {
        tbody.replaceChildren(h('tr', null, h('td', { colspan: cols.length }, emptyNote('Data not found.'))));
      } else {
        tbody.replaceChildren(...trs);
      }
    };

    const filters = h('div', { class: 'toolbar' },
      h('input', { placeholder: 'Search name, chest no or school', oninput: e => { f.q = e.target.value; fill(); } }),
      showZoneCol && zonesInData.length > 1 ? select([['', 'All zones']].concat(zonesInData.map(z => [z, z])), '', v => { f.zone = v; fill(); }) : null,
      select([['', 'All groups']].concat(groups.map(g => [g, 'Group ' + g])), '', v => { f.group = v; fill(); }),
      select([['', 'All genders'], ['BOYS', 'BOYS'], ['GIRLS', 'GIRLS']], '', v => { f.gender = v; fill(); }),
      select([['', 'All events']].concat(events.map(e => [e, e])), '', v => { f.event = v; fill(); }),
      isResult ? select([['', 'All positions'], ['1st', '1st'], ['2nd', '2nd'], ['3rd', '3rd']], '', v => { f.pos = v; fill(); }) : null,
     makePdfBtn(() => exportArchivePDF(baseTitle, getSubtitle(), cols, currentRows, fileBase, true)),
      h('button', { class: 'btn small', type: 'button', onclick: () => exportArchiveExcel(baseTitle, getSubtitle(), cols, currentRows, fileBase) }, 'Excel'),
      countEl
    );

    fill();
    area.replaceChildren(
      filters,
      h('div', { class: 'tw' }, h('table', { class: 't' },
        h('thead', null, h('tr', null, cols.map(c => h('th', null, c)))),
        tbody
      ))
    );
  }

  await render();
}

/* ====================== Lock / Unlock ====================== */
const LOCK_TEXT = {
  'list.school': ['Lock / Unlock - School Admin (Create list)', 'Tick a school to lock the Create list menu of its School Admin. Remove the tick to open it again.'],
  'list.zone': ['Lock / Unlock - Zone Admin (Create list)', 'Tick a zone to lock the Create list menu of its Zone Admin. Remove the tick to open it again.'],
  'list.circle': ['Lock / Unlock - Circle Admin (Create list)', 'Tick the box to lock the Create list menu of the Circle Admin. Remove the tick to open it again.'],
  'result.zone': ['Lock / Unlock - Create result', 'Tick a zone to lock the Create result menu of its Zone Admin. Remove the tick to open it again.']
};
const LOCK_KIND_TITLE = { 'result.zone': 'Zone Admin - Create result', 'result.circle': 'Circle Admin - Create result' };

function pageLock(page) {
  return async function () {
    const wide = isWide();
    const needZone = page === 'list.school' && wide;
    let zoneKey = needZone ? (S.lockZone || '') : '';
    let data = null, want = {};
    const root = h('div'), head = h('div', { class: 'toolbar' }), area = h('div');
    const title = (page === 'result.zone' && S.profile.role === 'Circle Admin') ? 'Lock / Unlock - Zone Admin (Create result)' : LOCK_TEXT[page][0];
    root.append(head, area);
    setMain(root, title);
    if (needZone) head.append(h('label', null, 'Zone'),
      select([['', 'Choose a zone']].concat(ZONES.map(z => [z.key, z.label])), zoneKey, v => { zoneKey = v; S.lockZone = v; load(); }));

    async function load() {
      area.replaceChildren();
      if (needZone && !zoneKey) { area.append(emptyNote('Choose a zone to see its schools.')); return; }
      const d = await busy(() => call('apiGetLockPage', page, zoneKey));
      if (!d) return;
      data = d; want = {};
      d.items.forEach(it => { want[it.key] = it.locked; });
      draw();
    }

    function draw() {
      const changes = () => data.items.filter(it => it.canChange && want[it.key] !== it.locked);
      const saveBtn = h('button', { class: 'btn', type: 'button', disabled: true, onclick: save }, 'Save');
      const sync = () => { saveBtn.disabled = !changes().length; };
      const boxes = [];
      const kinds = [...new Set(data.items.map(it => it.kind))];
      const rows = [];
      let lastKind = '';
      data.items.forEach(it => {
        if (kinds.length > 1 && it.kind !== lastKind) { rows.push(h('h3', { class: 'sec' }, LOCK_KIND_TITLE[it.kind] || it.kind)); lastKind = it.kind; }
        const cb = h('input', { type: 'checkbox', checked: it.locked, disabled: !it.canChange, 'aria-label': it.label,
          onchange: e => { want[it.key] = e.target.checked; sync(); } });
        boxes.push([it, cb]);
        rows.push(h('label', { class: 'lockrow' + (it.canChange ? '' : ' off') }, cb, h('span', { class: 'lbl' }, it.label),
          it.locked ? h('span', { class: 'chip warn' }, 'Locked' + (it.lockedBy ? ' by ' + it.lockedBy : '')) : h('span', { class: 'chip' }, 'Open'),
          it.canChange ? null : h('small', null, 'Only ' + it.lockedBy + ' or a higher admin can open this.')));
      });
      const setAll = v => { boxes.forEach(([it, cb]) => { if (it.canChange) { cb.checked = v; want[it.key] = v; } }); sync(); };
      area.replaceChildren(h('div', null,
        h('div', { class: 'note' }, LOCK_TEXT[page][1] + ' A locked menu stays visible but greyed, and nothing can be saved there. Click Save after you change the ticks.'),
        data.zoneLabel ? h('div', { class: 'card' }, h('b', null, 'Zone: ' + data.zoneLabel)) : null,
        h('div', { class: 'toolbar' },
          data.items.length > 1 ? h('button', { class: 'btn ghost small', type: 'button', onclick: () => setAll(true) }, 'Tick all') : null,
          data.items.length > 1 ? h('button', { class: 'btn ghost small', type: 'button', onclick: () => setAll(false) }, 'Remove all ticks') : null),
        data.items.length ? h('div', { class: 'card', style: { padding: '0' } }, rows) : emptyNote('Nothing to show.'),
        h('div', { class: 'toolbar' }, saveBtn)));
      sync();

      async function save() {
        const list = changes().map(it => ({ key: it.key, locked: want[it.key] }));
        if (!list.length) return toast('Nothing to save.');
        const r = await busyTry(() => call('apiSaveLocks', page, zoneKey, list));
        if (!r.ok) { if (r.error.code !== 'SESSION_EXPIRED') toast(r.error.message, 'error'); await load(); return; }
        data = r.data; want = {};
        data.items.forEach(it => { want[it.key] = it.locked; });
        draw();
        toast(r.data.changed ? 'Saved. ' + r.data.changed + ' change' + (r.data.changed === 1 ? '' : 's') + '.' : 'Nothing was changed.', 'ok');
      }
    }
    await load();
  };
}

        const tbody = h('tbody', null, list.map((t, i) => h('tr', null,
          h('td', null, i + 1),
          h('td', null, h('b', null, t.schoolNo)),
          h('td', { style: { textAlign: 'left' } }, t.schoolName),
          h('td', { style: { textAlign: 'left', fontWeight: '600' } }, t.teacherName),
          h('td', null, t.zoneLabel)
        )));
        tableWrap.replaceChildren(h('div', { class: 'tw' }, h('table', { class: 't' },
          h('thead', null, h('tr', null, ['Sl No.', 'School No', 'School Name', "Teacher's Name", 'Zone'].map(x => h('th', null, x)))),
          tbody
        )));
      } else {
        const list = (d.summary || []).filter(s =>
          (!f.zone || s.zone === f.zone) &&
          (!f.schoolNo || s.schoolNo === f.schoolNo) &&
          (!q || [s.schoolNo, s.schoolName, s.zoneLabel, s.count].join(' ').toLowerCase().includes(q))
        );
        const totalCnt = list.reduce((acc, s) => acc + (Number(s.count) || 0), 0);
        countChip.textContent = 'Schools: ' + list.length + ' · Total teachers: ' + totalCnt;
        if (!list.length) {
          tableWrap.replaceChildren(emptyNote('কোনো স্কুলের তথ্য পাওয়া যায়নি।'));
          return;
        }
        const tbody = h('tbody', null,
          list.map((s, i) => h('tr', null,
            h('td', null, i + 1),
            h('td', null, h('b', null, s.schoolNo)),
            h('td', { style: { textAlign: 'left' } }, s.schoolName),
            h('td', null, s.zoneLabel),
            h('td', null, h('span', { class: 'chest' }, s.count))
          )).concat([
            h('tr', { style: { background: '#EAF3EE', fontWeight: '700' } },
              h('td', { colspan: 4, style: { textAlign: 'right', paddingRight: '12px' } }, 'Total Teachers'),
              h('td', null, h('b', null, totalCnt))
            )
          ])
        );
        tableWrap.replaceChildren(h('div', { class: 'tw' }, h('table', { class: 't' },
          h('thead', null, h('tr', null, ['Sl No.', 'School No', 'School Name', 'Zone', 'Number of teachers'].map(x => h('th', null, x)))),
          tbody
        )));
      }
    };

    fill();
    area.replaceChildren(filters, tableWrap);
  }

  draw();
}

/* ====================== Update menu (Student / School / Teachers / Admin) ====================== */
async function pageUpdate() {
  const wide = isWide();
  const root = h('div'), head = h('div', { class: 'toolbar' }), banner = h('div'), area = h('div');
  root.append(head, banner, area);
  setMain(root, 'Update');

  // Zone Admin CANNOT see 'Admin update' in dropdown
  const modeOpts = [
    ['student', 'Student update'],
    ['school', 'School update'],
    ['teachers', 'Teachers update'],
    ['venue', 'Venue update']
  ];
  if (wide) modeOpts.push(['admin', 'Admin update']);

  let mode = 'student';
  let selectedZone = wide ? (S.updZone || ZONES[0].key) : S.profile.zone;

  function showSuccess(msg) {
    banner.replaceChildren(h('div', { class: 'ok-banner' }, '✅ ' + msg));
    toast(msg, 'ok');
  }
  function clearBanner() { banner.replaceChildren(); }

  function drawHead() {
    head.replaceChildren(
      h('label', null, 'Update section'),
      select(modeOpts, mode, v => { mode = v; clearBanner(); renderMode(); })
    );
  }

  function renderMode() {
    area.replaceChildren();
    if (mode === 'student') renderStudentUpdate();
    else if (mode === 'school') renderSchoolUpdate();
    else if (mode === 'teachers') renderTeachersUpdate();
    else if (mode === 'venue') renderVenueUpdate();
    else if (mode === 'admin' && wide) renderAdminUpdate();
  }

  /* ---------- 1. Student update (by Zone Chest No) ---------- */
  function renderStudentUpdate() {
    let zoneKey = wide ? selectedZone : S.profile.zone;
    const chestInp = h('input', {
      inputmode: 'numeric',
      maxlength: 5,
      placeholder: 'Enter zone chest number',
      style: { width: '210px' },
      oninput: e => { e.target.value = e.target.value.replace(/\D/g, ''); },
      onkeydown: e => { if (e.key === 'Enter') { e.preventDefault(); doSearch(); } }
    });
    const searchBtn = h('button', { class: 'btn', type: 'button', onclick: doSearch }, 'Search');
    const searchBar = h('div', { class: 'toolbar' },
      wide ? [h('label', null, 'Zone'), zoneSelect(zoneKey, v => { zoneKey = v; selectedZone = v; S.updZone = v; })] : h('span', { class: 'chip' }, 'Zone: ' + zoneLabel(zoneKey)),
      h('label', null, 'Chest No'),
      chestInp,
      searchBtn
    );
    const formBox = h('div');
    area.replaceChildren(searchBar, formBox);

    async function doSearch() {
      clearBanner();
      const ch = chestInp.value.trim();
      if (!ch) return toast('দয়া করে চেস্ট নম্বর লিখুন।', 'error');
      const res = await busy(() => call('apiFindStudentByChest', zoneKey, Number(ch)));
      if (!res) { formBox.replaceChildren(); return; }
      drawStudentEditor(res);
    }

    function drawStudentEditor(stu) {
      const rules = stu.ageRules || [];
      let eventsChanged = false;
      let eventsUnlocked = false;
      const picked = {}; // ev -> targetGroup
      (stu.events || []).forEach(ev => {
        const match = MATRIX_EVENTS.find(e => normEv(e) === normEv(ev.event));
        if (match) picked[match] = ev.targetGroup;
      });

      const nameInp = h('input', { value: stu.name || '', maxlength: 60, disabled: true });
      const fatherInp = h('input', { value: stu.father || '', maxlength: 60, disabled: true });
      const dobField = createDateField({
        valueIso: stu.dobIso || '',
        disabled: true,
        full: true,
        minYear: 2000,
        noFuture: true,
        onError: (msg, inpEl) => {
          toast('❌ ' + msg, 'error');
          dialog('Invalid Date of Birth', h('div', null, msg), [{ label: 'OK', value: true, cls: 'danger' }]).then(() => { inpEl.focus(); inpEl.select(); });
        }
      });
      const clsSel = select(CLASSES.map(c => [c, c]), stu.cls || CLASSES[0], null, { disabled: true });

      const unlockField = el => { el.disabled = false; el.focus(); };
      const fieldRow = (label, ctrl, onUnlock) => h('div', { class: 'upd-field' },
        h('label', null, label),
        ctrl,
        h('button', { class: 'ico-btn', type: 'button', title: 'Edit ' + label, onclick: () => onUnlock ? onUnlock() : unlockField(ctrl) }, '✏️')
      );

      // Events editor (same Create List matrix rules)
      const evBox = h('div', { class: 'ev-pills' });
      const evEditBtn = h('button', {
        class: 'ico-btn', type: 'button', title: 'Edit Events',
        onclick: () => { eventsUnlocked = true; renderEventsUI(); }
      }, '✏️');

      function checkStuAge(grp, ev, dobIso) {
        if (!rules.length || !dobIso || !grp) return null;
        const g = String(grp).toUpperCase(), evKey = normEv(ev);
        let best = null;
        for (const r of rules) {
          if (String(r.group).toUpperCase() !== g) continue;
          const rEv = normEv(r.event);
          if (rEv === evKey) { best = r; break; }
          if (rEv === 'ALL' && !best) best = r;
        }
        if (best && (dobIso < best.start || dobIso > best.end)) {
          return 'জন্মতারিখ (' + fmtDob(dobIso) + ') Group ' + g + '-এর ' + ev + ' ইভেন্টের বয়সের নিয়মে (' + fmtDob(best.start) + ' থেকে ' + fmtDob(best.end) + ') পড়ছে না।';
        }
        return null;
      }

      function renderEventsUI() {
        evBox.replaceChildren();
        const allowed = GROUP_EVENTS[stu.group] || new Set();
        const pickedEvs = Object.keys(picked).filter(e => picked[e]);
        const hasSpecial = pickedEvs.some(e => SPECIAL_EVENTS.has(e));
        const regCount = pickedEvs.filter(e => !SPECIAL_EVENTS.has(e)).length;

        MATRIX_EVENTS.forEach(ev => {
          if (!allowed.has(ev)) return;
          const checked = !!picked[ev];
          let dis = !eventsUnlocked;
          if (!dis && !checked) {
            if (hasSpecial) dis = true;
            else if (SPECIAL_EVENTS.has(ev) && regCount >= 1) dis = true;
            else if (!SPECIAL_EVENTS.has(ev) && regCount >= 2) dis = true;
          }
          const cb = h('input', {
            type: 'checkbox',
            checked: checked,
            disabled: dis,
            onchange: async () => {
              if (!cb.checked) {
                delete picked[ev];
                eventsChanged = true;
                renderEventsUI();
                return;
              }
              let tGrp = stu.group;
              if (ev === 'GYMNASTICS') {
                if (stu.group === 'A') tGrp = 'B';
                else if (stu.group === 'B') {
                  const choice = await dialog('Select Gymnastics Group',
                    h('p', { style: { margin: '0' } }, h('b', null, nameInp.value || stu.name), ' (Group B) কোন গ্রুপে GYMNASTICS খেলবে তা সিলেক্ট করুন:'),
                    [{ label: 'Cancel', value: '', cls: 'ghost' }, { label: 'Group B', value: 'B', cls: '' }, { label: 'Group C', value: 'C', cls: 'gold' }]);
                  if (!choice) { cb.checked = false; return; }
                  tGrp = choice;
                }
              }
              const ageErr = checkStuAge(tGrp, ev, dobField.getIso() || stu.dobIso);
              if (ageErr) { cb.checked = false; return toast('❌ ' + ageErr, 'error'); }

              const takenKey = tGrp + '|' + stu.gender + '|' + normEv(ev);
              if (stu.otherTaken && stu.otherTaken[takenKey]) {
                cb.checked = false;
                return toast('❌ Group ' + tGrp + ' ' + stu.gender + ' ' + ev + ' ইভেন্টে ইতিমধ্যেই ' + stu.otherTaken[takenKey] + ' আছে।', 'error');
              }
              picked[ev] = tGrp;
              eventsChanged = true;
              renderEventsUI();
            }
          });
          const badge = (ev === 'GYMNASTICS' && checked && (stu.group === 'A' || stu.group === 'B'))
            ? h('span', { class: 'gbadge' }, 'Gr ' + picked[ev]) : null;
          evBox.appendChild(h('label', { class: 'ev-pill' + (checked ? ' chk' : '') + (dis && !checked ? ' dis' : '') }, cb, ev, badge));
        });
      }

      renderEventsUI();

      const editAllBtn = h('button', {
        class: 'btn ghost',
        type: 'button',
        onclick: () => {
          [nameInp, fatherInp, clsSel].forEach(el => { el.disabled = false; });
          dobField.setDisabled(false);
          eventsUnlocked = true;
          renderEventsUI();
          nameInp.focus();
        }
      }, '✏️ Edit all');

      const updateBtn = h('button', {
        class: 'btn',
        type: 'button',
        onclick: async () => {
          if (dobField.hasError() || !dobField.getIso()) {
            return toast('❌ দয়া করে সঠিক জন্মতারিখ (dd-mmm-yyyy) দিন।', 'error');
          }
          const payload = {
            zone: stu.zone,
            chestNo: stu.chestNo,
            name: nameInp.value.trim(),
            father: fatherInp.value.trim(),
            dobIso: dobField.getIso(),
            cls: clsSel.value,
            group: stu.group
          };
          if (eventsChanged) {
            const evList = Object.keys(picked).filter(e => picked[e]).map(e => ({ event: e, targetGroup: picked[e] }));
            if (!evList.length) return toast('❌ অন্তত একটি ইভেন্ট সিলেক্ট থাকতে হবে।', 'error');
            payload.events = evList;
          }
          const updated = await busy(() => call('apiUpdateStudentByChest', payload));
          if (!updated) return;
          showSuccess('Student (Chest No ' + updated.chestNo + ' - ' + updated.name + ') updated successfully.');
          drawStudentEditor(updated);
        }
      }, 'Update');

      formBox.replaceChildren(
        h('div', { class: 'card' },
          h('div', { style: { display: 'flex', gap: '10px', flexWrap: 'wrap', alignItems: 'center', marginBottom: '10px' } },
            h('span', { class: 'chest', style: { fontSize: '15px', padding: '4px 12px' } }, 'Chest No: ' + stu.chestNo),
            h('b', null, stu.schoolNo + ' · ' + stu.schoolName),
            h('span', { class: 'chip' }, stu.zoneLabel),
            h('span', { class: 'chip' }, 'Group ' + stu.group + ' · ' + stu.gender)
          ),
          fieldRow('Name', nameInp),
          fieldRow("Father's Name", fatherInp),
          fieldRow('Date of Birth', dobField.el, () => { dobField.setDisabled(false); dobField.focus(); }),
          fieldRow('Class', clsSel),
          h('div', { class: 'upd-field' },
            h('label', null, 'Events'),
            evBox,
            evEditBtn
          ),
          h('div', { class: 'toolbar', style: { marginTop: '14px', marginBottom: '0' } }, editAllBtn, updateBtn)
        )
      );
    }
  }

  /* ---------- 2. School update ---------- */
  async function renderSchoolUpdate() {
    let zoneKey = wide ? selectedZone : S.profile.zone;
    let q = '', editingNo = '', schools = [];
    const bar = h('div', { class: 'toolbar' }), box = h('div');
    area.replaceChildren(bar, box);

    async function load() {
      const d = await busy(() => call('apiGetSchoolsForUpdate', zoneKey));
      if (!d) return;
      schools = d.schools || [];
      editingNo = '';
      draw();
    }

    function draw() {
      bar.replaceChildren(
        wide ? [h('label', null, 'Select zone'), zoneSelect(zoneKey, v => { zoneKey = v; selectedZone = v; S.updZone = v; clearBanner(); load(); })]
             : h('span', { class: 'chip' }, 'Zone: ' + zoneLabel(zoneKey)),
        h('input', { placeholder: 'Search school no or name', value: q, oninput: e => { q = e.target.value; fill(); } })
      );
      fill();
    }

    function fill() {
      const term = q.trim().toLowerCase();
      const list = schools.filter(s => !term || [s.schoolNo, s.schoolName].join(' ').toLowerCase().includes(term));
      if (!list.length) { box.replaceChildren(emptyNote('কোনো স্কুল পাওয়া যায়নি।')); return; }

      const tbody = h('tbody', null, list.map((s, i) => {
        if (editingNo === s.schoolNo) {
          const inp = h('input', { value: s.schoolName, style: { width: '100%', textAlign: 'left' } });
          setTimeout(() => inp.focus(), 0);
          return h('tr', { class: 'dirty' },
            h('td', null, i + 1),
            h('td', null, h('b', null, s.schoolNo)),
            h('td', null, inp),
            h('td', null, s.zoneLabel),
            h('td', null, h('div', { style: { display: 'flex', gap: '6px', justifyContent: 'center' } },
              h('button', {
                class: 'btn small', type: 'button',
                onclick: async () => {
                  const res = await busy(() => call('apiUpdateSchoolInfo', s.schoolNo, inp.value));
                  if (!res) return;
                  s.schoolName = res.schoolName;
                  editingNo = '';
                  showSuccess(res.schoolNo + ' - ' + res.schoolName + ' updated successfully.');
                  fill();
                }
              }, 'Update'),
              h('button', { class: 'btn ghost small', type: 'button', onclick: () => { editingNo = ''; fill(); } }, 'Cancel')
            ))
          );
        }
        return h('tr', null,
          h('td', null, i + 1),
          h('td', null, h('b', null, s.schoolNo)),
          h('td', { style: { textAlign: 'left', fontWeight: '600' } }, s.schoolName),
          h('td', null, s.zoneLabel),
          h('td', null, h('button', { class: 'ico-btn', type: 'button', title: 'Edit school', onclick: () => { editingNo = s.schoolNo; fill(); } }, '✏️'))
        );
      }));

      box.replaceChildren(h('div', { class: 'tw' }, h('table', { class: 't' },
        h('thead', null, h('tr', null, ['Sl No.', 'School No', 'School Name', 'Zone', 'Edit'].map(x => h('th', null, x)))),
        tbody
      )));
    }

    await load();
  }

  /* ---------- 3. Teachers update (+ Add new teacher & Edit) ---------- */
  async function renderTeachersUpdate() {
    let zoneKey = wide ? selectedZone : S.profile.zone;
    let q = '', schoolFilt = '', editingRow = 0, showAdd = false;
    let data = { schools: [], teachers: [] };
    const bar = h('div', { class: 'toolbar' }), addWrap = h('div'), box = h('div');
    area.replaceChildren(bar, addWrap, box);

    async function load() {
      const d = await busy(() => call('apiGetTeachersForUpdate', zoneKey));
      if (!d) return;
      data = d;
      editingRow = 0;
      if (schoolFilt && !(data.schools || []).some(s => s.schoolNo === schoolFilt)) schoolFilt = '';
      draw();
    }

    function drawAddBox() {
      if (!showAdd) { addWrap.replaceChildren(); return; }
      const schOpts = (data.schools || []).map(s => [s.schoolNo, s.schoolNo + ' - ' + s.schoolName]);
      const schSel = select([['', 'Select School No (KW...)']].concat(schOpts), schoolFilt || '', null, { style: { minWidth: '240px' } });
      const nameInp = h('input', { placeholder: "Enter teacher's name", style: { minWidth: '240px', flex: '1' } });
      const saveNew = async () => {
        if (!schSel.value) return toast('দয়া করে স্কুল নম্বর সিলেক্ট করুন।', 'error');
        if (!nameInp.value.trim()) return toast('দয়া করে শিক্ষকের নাম লিখুন।', 'error');
        const res = await busy(() => call('apiAddTeacher', schSel.value, nameInp.value.trim()));
        if (!res) return;
        showAdd = false;
        showSuccess('New teacher "' + res.teacherName + '" (' + res.schoolNo + ') added successfully.');
        await load();
      };
      nameInp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); saveNew(); } });

      addWrap.replaceChildren(h('div', { class: 'add-box' },
        h('div', { style: { fontWeight: '700', color: 'var(--dark)', marginBottom: '8px' } }, '+ Add new teacher'),
        h('div', { class: 'toolbar', style: { marginBottom: '0' } },
          h('label', null, 'School No'), schSel,
          h('label', null, "Teacher's Name"), nameInp,
          h('button', { class: 'btn', type: 'button', onclick: saveNew }, 'Save'),
          h('button', { class: 'btn ghost', type: 'button', onclick: () => { showAdd = false; drawAddBox(); } }, 'Cancel')
        )
      ));
      setTimeout(() => (schSel.value ? nameInp : schSel).focus(), 0);
    }

    function draw() {
      const schOpts = [['', 'All schools']].concat((data.schools || []).map(s => [s.schoolNo, s.schoolNo + ' - ' + s.schoolName]));
      bar.replaceChildren(
        wide ? [h('label', null, 'Select zone'), select([['', 'All zones']].concat(ZONES.map(z => [z.key, z.label])), zoneKey, v => { zoneKey = v; if (v) { selectedZone = v; S.updZone = v; } schoolFilt = ''; clearBanner(); load(); })]
             : h('span', { class: 'chip' }, 'Zone: ' + zoneLabel(zoneKey)),
        h('button', { class: 'btn', type: 'button', onclick: () => { showAdd = !showAdd; drawAddBox(); } }, '+ Add new teacher'),
        select(schOpts, schoolFilt, v => { schoolFilt = v; fill(); }),
        h('input', { placeholder: 'Search teacher or school', value: q, oninput: e => { q = e.target.value; fill(); } })
      );
      drawAddBox();
      fill();
    }

    function fill() {
      const term = q.trim().toLowerCase();
      const list = (data.teachers || []).filter(t =>
        (!schoolFilt || t.schoolNo === schoolFilt) &&
        (!term || [t.schoolNo, t.schoolName, t.teacherName, t.zoneLabel].join(' ').toLowerCase().includes(term))
      );
      if (!list.length) { box.replaceChildren(emptyNote('কোনো শিক্ষকের তথ্য পাওয়া যায়নি।')); return; }

      const schOpts = (data.schools || []).map(s => [s.schoolNo, s.schoolNo + ' - ' + s.schoolName]);
      const tbody = h('tbody', null, list.map((t, i) => {
        if (editingRow === t.rowNum) {
          const schSel = select(schOpts, t.schoolNo, null, { style: { minWidth: '180px' } });
          const inp = h('input', { value: t.teacherName, style: { width: '100%', textAlign: 'left' } });
          setTimeout(() => inp.focus(), 0);
          return h('tr', { class: 'dirty' },
            h('td', null, i + 1),
            h('td', { colspan: 2 }, schSel),
            h('td', null, inp),
            h('td', null, t.zoneLabel),
            h('td', null, h('div', { style: { display: 'flex', gap: '6px', justifyContent: 'center' } },
              h('button', {
                class: 'btn small', type: 'button',
                onclick: async () => {
                  const res = await busy(() => call('apiUpdateTeacher', t.rowNum, schSel.value, inp.value.trim()));
                  if (!res) return;
                  editingRow = 0;
                  showSuccess('Teacher "' + res.teacherName + '" (' + res.schoolNo + ') updated successfully.');
                  await load();
                }
              }, 'Update'),
              h('button', { class: 'btn ghost small', type: 'button', onclick: () => { editingRow = 0; fill(); } }, 'Cancel')
            ))
          );
        }
        return h('tr', null,
          h('td', null, i + 1),
          h('td', null, h('b', null, t.schoolNo)),
          h('td', { style: { textAlign: 'left' } }, t.schoolName),
          h('td', { style: { textAlign: 'left', fontWeight: '600' } }, t.teacherName),
          h('td', null, t.zoneLabel),
          h('td', null, h('div', { style: { display: 'flex', gap: '6px', justifyContent: 'center' } },
            h('button', { class: 'ico-btn', type: 'button', title: 'Edit teacher', onclick: () => { editingRow = t.rowNum; fill(); } }, '✏️'),
            h('button', {
              class: 'ico-btn del', type: 'button', title: 'Delete teacher',
              onclick: async () => {
                if (!(await confirmBox('Delete teacher', 'Remove "' + t.teacherName + '" (' + t.schoolNo + ') from Teachers list?', 'Delete', 'danger'))) return;
                const res = await busy(() => call('apiDeleteTeacher', t.rowNum));
                if (!res) return;
                showSuccess('Teacher "' + t.teacherName + '" removed successfully.');
                await load();
              }
            }, '🗑️')
          ))
        );
      }));

      box.replaceChildren(h('div', { class: 'tw' }, h('table', { class: 't' },
        h('thead', null, h('tr', null, ['Sl No.', 'School No', 'School Name', "Teacher's Name", 'Zone', 'Action'].map(x => h('th', null, x)))),
        tbody
      )));
    }

    await load();
  }

  /* ---------- 4. Venue update (Zone Admin: own zone; Circle/Super: all) ---------- */
  async function renderVenueUpdate() {
    let q = '', editingRow = 0, venues = [];
    const bar = h('div', { class: 'toolbar' }), box = h('div');
    area.replaceChildren(bar, box);

    async function load() {
      const d = await busy(() => call('apiGetVenuesForUpdate'));
      if (!d) return;
      venues = d.venues || [];
      editingRow = 0;
      draw();
    }

    function draw() {
      bar.replaceChildren(
        h('input', { placeholder: 'Search zone, venue or date', value: q, oninput: e => { q = e.target.value; fill(); } })
      );
      fill();
    }

    function fill() {
      const term = q.trim().toLowerCase();
      const list = venues.filter(v =>
        !term || [v.zone, v.zoneLabel, v.venue, v.date].join(' ').toLowerCase().includes(term)
      );
      if (!list.length) { box.replaceChildren(emptyNote('কোনো ভেন্যুর তথ্য পাওয়া যায়নি।')); return; }

      const tbody = h('tbody', null, list.map((v, i) => {
        if (editingRow === v.rowNum) {
          const venueInp = h('input', { value: v.venue || '', placeholder: 'Venue name', style: { width: '100%', textAlign: 'left' } });
          const dateField = createDateField({
            valueIso: v.dateIso || '',
            valueText: v.date ? fmtDateDisplay(v.date) : '',
            placeholder: 'dd-mmm-yyyy',
            onError: msg => toast('❌ ' + msg, 'error')
          });
          setTimeout(() => venueInp.focus(), 0);
          return h('tr', { class: 'dirty' },
            h('td', null, i + 1),
            h('td', { style: { fontWeight: '600' } }, v.zoneLabel),
            h('td', null, venueInp),
            h('td', null, dateField.el),
            h('td', null, h('div', { style: { display: 'flex', gap: '6px', justifyContent: 'center' } },
              h('button', {
                class: 'btn small', type: 'button',
                onclick: async () => {
                  if (dateField.hasError()) return toast('❌ দয়া করে সঠিক তারিখ (dd-mmm-yyyy) লিখুন।', 'error');
                  const res = await busy(() => call('apiUpdateVenueInfo', v.rowNum, {
                    venue: venueInp.value.trim(),
                    dateIso: dateField.getIso(),
                    date: dateField.getDisplay()
                  }));
                  if (!res) return;
                  Object.assign(v, res);
                  editingRow = 0;
                  showSuccess('Venue (' + v.zoneLabel + ') updated successfully.');
                  fill();
                }
              }, 'Update'),
              h('button', { class: 'btn ghost small', type: 'button', onclick: () => { editingRow = 0; fill(); } }, 'Cancel')
            ))
          );
        }
        return h('tr', null,
          h('td', null, i + 1),
          h('td', { style: { fontWeight: '600' } }, v.zoneLabel),
          h('td', { style: { textAlign: 'left' } }, v.venue || '–'),
          h('td', null, v.date ? fmtDateDisplay(v.date) : '–'),
          h('td', null, h('button', { class: 'ico-btn', type: 'button', title: 'Edit venue', onclick: () => { editingRow = v.rowNum; fill(); } }, '✏️'))
        );
      }));

      box.replaceChildren(h('div', { class: 'tw' }, h('table', { class: 't' },
        h('thead', null, h('tr', null, ['Sl No.', 'Zone / Circle', 'Venue', 'Date', 'Edit'].map(x => h('th', null, x)))),
        tbody
      )));
    }

    await load();
  }

  /* ---------- 5. Admin update (Circle Admin & Super Admin only) ---------- */
  async function renderAdminUpdate() {
    let q = '', zFilt = '', editingRow = 0, admins = [];
    const bar = h('div', { class: 'toolbar' }), box = h('div');
    area.replaceChildren(bar, box);

    async function load() {
      const d = await busy(() => call('apiGetAdminsForUpdate'));
      if (!d) return;
      admins = d.admins || [];
      editingRow = 0;
      draw();
    }

    function draw() {
      const zOpts = [['', 'All zones & circle']].concat([...new Set(admins.map(a => a.zone))].map(z => [z, zoneLabel(z) === z ? z : zoneLabel(z)]));
      bar.replaceChildren(
        h('label', null, 'Zone / Circle'),
        select(zOpts, zFilt, v => { zFilt = v; fill(); }),
        h('input', { placeholder: 'Search name, designation or contact', value: q, oninput: e => { q = e.target.value; fill(); } })
      );
      fill();
    }

    function fill() {
      const term = q.trim().toLowerCase();
      const list = admins.filter(a =>
        (!zFilt || a.zone === zFilt) &&
        (!term || [a.zone, a.zoneLabel, a.designation, a.name, a.contact].join(' ').toLowerCase().includes(term))
      );
      if (!list.length) { box.replaceChildren(emptyNote('কোনো অ্যাডমিনের তথ্য পাওয়া যায়নি।')); return; }

      const tbody = h('tbody', null, list.map((a, i) => {
        if (editingRow === a.rowNum) {
          const nameInp = h('input', { value: a.name || '', placeholder: 'Admin name', style: { textAlign: 'left' } });
          const contactInp = h('input', { value: a.contact || '', placeholder: 'Phone / contact' });
          const photoInp = h('input', { value: a.photo || '', placeholder: 'Photo URL (optional)', style: { textAlign: 'left' } });
          setTimeout(() => nameInp.focus(), 0);
          return h('tr', { class: 'dirty' },
            h('td', null, i + 1),
            h('td', null, a.zoneLabel),
            h('td', null, a.designation),
            h('td', null, nameInp),
            h('td', null, contactInp),
            h('td', null, photoInp),
            h('td', null, h('div', { style: { display: 'flex', gap: '6px', justifyContent: 'center' } },
              h('button', {
                class: 'btn small', type: 'button',
                onclick: async () => {
                  const res = await busy(() => call('apiUpdateAdminInfo', a.rowNum, {
                    name: nameInp.value.trim(),
                    contact: contactInp.value.trim(),
                    photo: photoInp.value.trim()
                  }));
                  if (!res) return;
                  Object.assign(a, res);
                  editingRow = 0;
                  showSuccess(a.designation + ' (' + a.zoneLabel + ') updated successfully.');
                  if (/secretary/i.test(a.designation || '')) loadBrandPhoto();
                  fill();
                }
              }, 'Update'),
              h('button', { class: 'btn ghost small', type: 'button', onclick: () => { editingRow = 0; fill(); } }, 'Cancel')
            ))
          );
        }
        return h('tr', null,
          h('td', null, i + 1),
          h('td', null, a.zoneLabel),
          h('td', null, a.designation),
          h('td', { style: { textAlign: 'left', fontWeight: '600' } }, a.name || '–'),
          h('td', null, a.contact || '–'),
          h('td', null, a.photo ? h('span', { class: 'chip' }, 'Photo set') : '–'),
          h('td', null, h('button', { class: 'ico-btn', type: 'button', title: 'Edit admin', onclick: () => { editingRow = a.rowNum; fill(); } }, '✏️'))
        );
      }));

      box.replaceChildren(h('div', { class: 'tw' }, h('table', { class: 't' },
        h('thead', null, h('tr', null, ['Sl No.', 'Zone / Circle', 'Designation', 'Name', 'Contact', 'Photo', 'Edit'].map(x => h('th', null, x)))),
        tbody
      )));
    }

    await load();
  }

  drawHead();
  renderMode();
}

// মেনুবার (#side) এবং ৩-লাইন বাটনের (#burger) বাইরে টাচ করলে মেনু বন্ধ করার কোড
document.addEventListener('click', function (e) {
  const side = document.getElementById('side');
  const burger = document.getElementById('burger');
  const app = document.getElementById('app');
  const content = document.getElementById('content');
  const main = document.getElementById('main');

  if (!side || !burger) return;

  // মেনু বা ৩-লাইন বাটনের ভেতরে টাচ করলে মেনু বন্ধ করবে না
  if (side.contains(e.target) || burger.contains(e.target)) return;

  // বাইরে টাচ করলে মেনু বন্ধ হবে এবং মূল পেজ দৃশ্যমান থাকবে
  side.classList.remove('open', 'show', 'active');
  if (app) app.classList.remove('open', 'menu-open', 'nav-open');
  document.body.classList.remove('open', 'menu-open', 'nav-open');
  if (content) content.hidden = false;
  if (main) main.hidden = false;
});
</script>
