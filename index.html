<!DOCTYPE html>

<html lang="en">
<head>

<title>Khanakul West Circle Annual Sports - 2026</title>
<style>
:root{--green:#1F6B4A;--dark:#0F3D2B;--gold:#E8A317;--ink:#14201A;--muted:#4B5A52;--bg:#F3F6F2;--card:#fff;--line:#DDE5DF;--red:#B3261E;--soft:#EAF3EE}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.45}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0}
.btn{height:38px;padding:0 16px;border:0;border-radius:10px;font-weight:600;cursor:pointer;background:var(--green);color:#fff;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.gold{background:var(--gold);color:var(--ink)}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--red)}.btn.small{height:30px;padding:0 10px;font-size:12px}
.btn.blue{background:#1A73E8;color:#fff}
input,select{height:38px;border:1px solid #B7C6BC;border-radius:8px;padding:0 10px;background:#fff;max-width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
input::placeholder{color:#A3AFA8}
/* login */
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#0B2F21,#1F6B4A 60%,#2E8B57)}
 .glass{width:100%;max-width:420px;padding:30px;border-radius:20px;background: linear-gradient(rgba(11, 47, 33, 0.7), rgba(31, 107, 74, 0.7)), url('https://github.com/asimhub26/sports2026/blob/main/Paddy%20drop.jpg?raw=true') no-repeat center center; background-size: cover; border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(4px);box-shadow:0 20px 50px rgba(0,0,0,.3);color:#fff;animation:rise .5s ease both}

/*.glass{width:100%;max-width:420px;padding:30px;border-radius:20px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 50px rgba(0,0,0,.3);color:#fff;animation:rise .5s ease both}*/

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.glass h1{font-size:19px;line-height:1.3;margin-bottom:6px}.glass p{margin:0 0 18px}
.glass label{display:block;font-size:13px;margin-bottom:12px}
.glass input,.glass select{width:100%;height:44px;border:0;border-radius:10px;margin-top:4px;font-size:15px;color:var(--ink)}
.glass select.ph{color:#A3AFA8}
.pw{position:relative}.pw button{position:absolute;right:6px;top:8px;height:30px;border:0;background:transparent;color:var(--green);font-weight:600;cursor:pointer}
.glass .btn{width:100%;height:46px;font-size:16px;background:var(--gold);color:var(--ink);margin-top:4px}
.err{background:#FDECEA;color:var(--red);border-radius:8px;padding:8px 10px;margin:0 0 12px;font-size:13px}
/* app shell */
#app{display:flex;min-height:100%}
#side{width:250px;flex:none;background:var(--dark);color:#fff;padding:14px 10px;overflow-y:auto;height:100vh;position:sticky;top:0;transition:width .2s}
#side .brand{font-weight:700;margin:4px 8px 12px;font-size:15px}
#side.collapsed{width:0;padding:0;overflow:hidden}
.mi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;color:#fff;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px}
.mi .lbl{flex:1;min-width:0}
.ico{display:inline-flex;flex:none;opacity:.9}
.ico svg{display:block}
.mi:hover{background:rgba(255,255,255,.1)}.mi.active{background:rgba(255,255,255,.2);font-weight:700}
.mi.locked{opacity:.5;cursor:not-allowed}.mi.locked:hover{background:transparent}.mi .lk{margin-left:auto;opacity:.9}
.lockrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.lockrow:last-child{border-bottom:0}.lockrow.off{opacity:.6;cursor:not-allowed}
.lockrow input{width:18px;height:18px;min-width:0;padding:0;flex:none}.lockrow .lbl{flex:1;min-width:160px}
.mg{font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.75;margin:10px 8px 2px}
.sub{margin-left:12px;border-left:1px solid rgba(255,255,255,.2);padding-left:6px}
.caret::after{content:" ▸";opacity:.7}.caret.open::after{content:" ▾"}
#content{flex:1;min-width:0;display:flex;flex-direction:column}
#top{background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center;position:sticky;top:0;z-index:5}
#top .who{flex:1;min-width:0}#top .who b{display:block;font-size:15px}
#top .who span{font-size:12px;color:var(--muted)}
#top .role{font-size:12px;background:var(--soft);padding:3px 10px;border-radius:99px;color:var(--green);font-weight:600}
#burger{display:inline-flex}
#main{padding:18px;max-width:1400px;width:100%}
.ph1{font-size:20px;margin-bottom:12px}
.card{background:var(--card);border-radius:12px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:12px;animation:rise .25s ease both}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.stat{background:#fff;border-radius:12px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.stat small{color:var(--muted)}.stat b{display:block;font-size:22px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.sec{font-size:15px;margin:16px 0 8px;color:var(--dark)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar label{font-size:12px;color:var(--muted)}
.chip{display:inline-block;font-size:12px;padding:2px 10px;border-radius:99px;background:var(--soft);color:var(--green);font-weight:600}
.chip.warn{background:#FFF4D6;color:#7A5200}.chip.bad{background:#FDECEA;color:var(--red)}

table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:center;padding:8px 6px;border-bottom:2px solid var(--ink);white-space:nowrap;position:sticky;top:0;background:#fff}
table.t td{padding:5px 6px;border-bottom:1px solid #C9D3CC;vertical-align:middle;text-align:center}
table.t tr.dirty td{background:#FFFBEA}
table.t td input,table.t td select{width:100%;min-width:90px;height:32px;text-align:center;text-align-last:center}

.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12px}.bar span.l{width:96px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar i{display:block;height:14px;border-radius:7px;background:var(--green);min-width:2px}
.donut{width:120px;height:120px;border-radius:50%;flex:none}
.exportbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.btn-pdf { background-color: #ffebee !important; color: #B3261E !important; border-color: #ffcdd2 !important; }

.empty{color:var(--muted);padding:16px;text-align:center}
.person{display:flex;gap:12px;align-items:center}.avatar{width:46px;height:46px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.fest{background:linear-gradient(135deg,#0F3D2B,#1F6B4A);color:#fff;border-radius:16px;padding:20px;margin-bottom:12px}
.fest.alt{background:linear-gradient(135deg,#B8860B,#E8A317);color:var(--ink)}
.fest h3{font-size:18px;margin-bottom:6px}
/* feedback */
#toasts{position:fixed;right:14px;top:14px;z-index:60;display:flex;flex-direction:column;gap:8px;max-width:min(92vw,380px)}
.toast{background:var(--dark);color:#fff;padding:10px 14px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:rise .2s ease}
.toast.error{background:var(--red)}.toast.ok{background:var(--green)}
#overlay{position:fixed;inset:0;background:rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;z-index:70}
.spinner{width:42px;height:42px;border:5px solid #CFE0D6;border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}

.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:80;padding:16px}
.modal{background:#fff;border-radius:14px;padding:18px;max-width:460px;width:100%}.modal h3{margin-bottom:8px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
/* report preview */
.sheetwrap{background:#fff;border-radius:8px;padding:10px;margin-bottom:14px;overflow:auto;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.sheetwrap table{border-collapse:collapse;table-layout:fixed;font-family:Calibri,"Segoe UI",Arial,sans-serif}
.sheetwrap td{padding:0 3px;overflow:hidden;vertical-align:middle;white-space:nowrap}
.sheetwrap td.wrap{white-space:normal}
#printRoot{display:none}
@media (max-width:860px){
 #side{position:fixed;z-index:40;left:0;top:0;height:100%;box-shadow:0 0 30px rgba(0,0,0,.4);transform:translateX(-100%);transition:transform .2s;width:260px}
 #side.open{transform:none}#side.collapsed{width:260px;padding:14px 10px}
 #main{padding:12px}.glass{padding:22px}
 
 /* Fix for top header in mobile */
 #top { flex-wrap: wrap; gap: 8px 12px; }
 #top .who { flex: 1 1 calc(100% - 55px); }
 #top .who b { font-size: 14px; }

}
@media print{
 body{background:#fff}#login,#app,#toasts,#overlay,#modalRoot{display:none!important}
 body.printing #printRoot{display:block}

 .sheetwrap:last-child{page-break-after:auto;break-after:auto}
}
 /* Main page background picture */
#content {
  min-height: 100vh;
  background: linear-gradient(rgba(243, 246, 242, 0.78), rgba(243, 246, 242, 0.78)),
              url('https://github.com/asimhub26/sports2026/blob/main/sandakphu.JPG?raw=true') center center / cover no-repeat fixed;
}
.card, .stat, .tw {
  background: rgba(255, 255, 255, 0.90);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);

<script>
'use strict';
/* ====================== core helpers ====================== */
const $ = (s, r) => (r || document).querySelector(s);
const ZONES = [
  { key: 'THAKURANICHAK 1', label: 'Thakuranichak 1' }, { key: 'THAKURANICHAK 2', label: 'Thakuranichak 2' },
  { key: 'GHOSHPUR UTTAR', label: 'Ghoshpur Uttar' }, { key: 'GHOSHPUR MADHYA', label: 'Ghoshpur Madhya' },
  { key: 'GHOSHPUR PASCHIM', label: 'Ghoshpur Paschim' }, { key: 'KISHOREPUR 1', label: 'Kishorepur 1' }, { key: 'KISHOREPUR 2', label: 'Kishorepur 2' }
];
const CLASSES = ['CLASS PP', 'CLASS I', 'CLASS II', 'CLASS III', 'CLASS IV', 'CLASS V'];
const S = { token: null, profile: null, menu: [], activeId: '' };

/** Builds elements without innerHTML, so names typed by users can never run as code. */
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  const late = {};
  for (const k in (props || {})) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k.slice(0, 2) === 'on' && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else if (k === 'value' || k === 'checked' || k === 'selected' || k === 'disabled') late[k] = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  kids.flat(Infinity).forEach(c => { if (c == null || c === false) return; e.appendChild(c.nodeType ? c : document.createTextNode(String(c))); });
  for (const k in late) e[k] = late[k];
  return e;
}

function toast(msg, kind) {
  const t = h('div', { class: 'toast ' + (kind || '') }, msg);
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), kind === 'error' ? 7000 : 3800);
}

function dialog(title, body, buttons) {
  return new Promise(resolve => {
    const root = $('#modalRoot');
    const close = v => { bg.remove(); resolve(v); };
    const acts = h('div', { class: 'acts' }, (buttons || [{ label: 'OK', value: true }]).map(b =>
      h('button', { class: 'btn ' + (b.cls || ''), type: 'button', onclick: () => close(b.value) }, b.label)));
    const bg = h('div', { class: 'modalbg', role: 'dialog', 'aria-modal': 'true' }, h('div', { class: 'modal' }, h('h3', null, title), body, acts));
    root.appendChild(bg);
    const first = acts.querySelector('button:last-child'); if (first) first.focus();
  });
}
const confirmBox = (title, text, ok, cls) => dialog(title, h('div', null, text),
  [{ label: 'Cancel', value: false, cls: 'ghost' }, { label: ok || 'Yes', value: true, cls: cls || '' }]);

/** Calls a server function that returns {ok,data} / {ok:false,error,code}. */
// ধাপ ২-এ কপি করা আপনার Apps Script Web App (/exec) লিংকটি এখানে বসান
const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbwOaZVM6kRxGBzPc4qotoMGctLJ4LiVCSyUmLISQbpnQKg86P5EwOhUvCfsscDJS8ul/exec';

function handleApiResponse(res, resolve, reject) {
  if (res && res.ok) return resolve(res.data);
  const err = new Error((res && res.error) || 'Something went wrong.');
  err.code = res && res.code;
  if (err.code === 'SESSION_EXPIRED') sessionEnded(err.message);
  if (err.code === 'PAGE_LOCKED') setTimeout(onPageLocked, 0);
  reject(err);
}

/** Calls a server function that returns {ok,data} / {ok:false,error,code}. */
async function api(name, ...args) {
  // Apps Script-এর ভেতর থেকে খুললে আগের মতোই google.script.run ব্যবহার করবে
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    return new Promise((resolve, reject) => {
      if (typeof google.script.run[name] !== 'function') {
        return reject(new Error('Missing server function: ' + String(name)));
      }
      google.script.run
        .withSuccessHandler(res => handleApiResponse(res, resolve, reject))
        .withFailureHandler(() => reject(new Error('Connection problem. Please check the internet and try again.')))[name](...args);
    });
  }

  // GitHub Pages থেকে খুললে fetch() দিয়ে Apps Script-এ রিকোয়েস্ট পাঠাবে
  let res;
  try {
    const resp = await fetch(GAS_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // CORS preflight এড়ানোর জন্য text/plain জরুরি
      body: JSON.stringify({ fn: name, args: args }),
      redirect: 'follow'
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    res = await resp.json();
  } catch (e) {
    throw new Error('Connection problem. Please check the internet and try again.');
  }

  if (res && res.ok) return res.data;
  const err = new Error((res && res.error) || 'Something went wrong.');
  err.code = res && res.code;
  if (err.code === 'SESSION_EXPIRED') sessionEnded(err.message);
  if (err.code === 'PAGE_LOCKED') setTimeout(onPageLocked, 0);
  throw err;
}
const call = (name, ...args) => api(name, S.token, ...args);

let busyCount = 0;
/** Shows the spinner while fn runs. Errors become a toast and the result is undefined. */
async function busy(fn, quiet) {
  busyCount++; $('#overlay').hidden = false;
  try { return await fn(); }
  catch (e) { if (!quiet && e.code !== 'SESSION_EXPIRED') toast(e.message, 'error'); return undefined; }
  finally { busyCount--; if (!busyCount) $('#overlay').hidden = true; }
}

/** Like busy(), but gives the error back ({ok:false,error}) instead of only showing a toast. */
async function busyTry(fn) {
  busyCount++; $('#overlay').hidden = false;
  try { return { ok: true, data: await fn() }; }
  catch (e) { return { ok: false, error: e }; }
  finally { busyCount--; if (!busyCount) $('#overlay').hidden = true; }
}

function downloadB64(res) {
  const bin = atob(res.base64), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([bytes], { type: res.mimeType }));
  const a = h('a', { href: url, download: res.fileName });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 15000);
}

const isWide = () => S.profile && (S.profile.role === 'Circle Admin' || S.profile.role === 'Super Admin');
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function fmtDob(iso) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ''); return m ? (+m[3]) + '-' + MONTHS[+m[2] - 1] + '-' + m[1] : ''; }
const zoneLabel = k => (ZONES.find(z => z.key === k) || { label: k }).label;

function select(options, value, onchange, attrs) {
  const s = h('select', Object.assign({ onchange: e => onchange && onchange(e.target.value) }, attrs || {}),
    options.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return h('option', { value: v }, l); }));
  s.value = value == null ? '' : value;
  return s;
}
const zoneSelect = (value, onchange) => select(ZONES.map(z => [z.key, z.label]), value, onchange);

/* ====================== report preview (the same model is used for PDF and Excel) ====================== */
const PX = 96 / 72;

function renderSheet(sh, model) {
  const nC = sh.colWidths.length, nR = sh.rowCount;
  const cells = Array.from({ length: nR }, () => Array(nC).fill(null));
  sh.rects.forEach(rc => {
    const rs = rc.rs || (rc.vals ? rc.vals.length : 1), cs = rc.cs || (rc.vals ? rc.vals[0].length : 1);
    const style = { border: rc.border, bold: rc.bold, italic: rc.italic, size: rc.size, color: rc.color, h: rc.h, bg: rc.bg, wrap: rc.wrap, font: rc.font };
    for (let i = 0; i < rs; i++) for (let j = 0; j < cs; j++) {
      const r = rc.r - 1 + i, c = rc.c - 1 + j;
      if (r >= nR || c >= nC) continue;
      const prev = cells[r][c] && !cells[r][c].skip ? cells[r][c] : { v: '' };
      const cell = Object.assign({}, prev, { rs: 1, cs: 1, skip: false });
      Object.keys(style).forEach(k => { if (style[k] !== undefined) cell[k] = style[k]; });
      cell.edges = { t: i === 0, b: i === rs - 1, l: j === 0, r: j === cs - 1 };
      if (rc.vals) cell.v = rc.vals[i][j];
      else if (rc.v !== undefined && i === 0 && j === 0) cell.v = rc.v;
      if (rc.merge) {
        if (i === 0 && j === 0) { cell.rs = rs; cell.cs = cs; } else cell.skip = true;
      }
      cells[r][c] = cell;
    }
  });
  const colgroup = h('colgroup', null, sh.colWidths.map(w => h('col', { style: { width: Math.round(w * PX) + 'px' } })));
  const tbody = h('tbody');
  for (let r = 0; r < nR; r++) {
    const px = (sh.rowPx && sh.rowPx[r + 1]) || sh.defaultRowPx;
    const tr = h('tr', { style: { height: px + 'px' }, class: sh.frozenRows && r + 1 > sh.frozenRows ? 'data-row' : '' });
    for (let c = 0; c < nC; c++) {
      const cell = cells[r][c];
      if (cell && cell.skip) continue;
      const td = h('td');
      if (cell) {
        td.textContent = cell.v == null ? '' : cell.v;
        if (cell.rs > 1) td.rowSpan = cell.rs;
        if (cell.cs > 1) td.colSpan = cell.cs;
        const st = td.style;
        st.fontSize = (cell.size || sh.baseSize || 10) + 'pt';
        if (cell.bold) st.fontWeight = '700';
        if (cell.italic) st.fontStyle = 'italic';
        if (cell.color) st.color = cell.color;
        if (cell.bg) st.background = cell.bg;
        if (cell.h) st.textAlign = cell.h;
        if (cell.font) st.fontFamily = '"' + cell.font + '",serif';
        if (cell.wrap) td.className = 'wrap';
        const b = cell.border, e = cell.edges || {};
        if (b === 'all') st.border = '1px solid #000';
        else if (b === 'box') { if (e.t) st.borderTop = '1px solid #000'; if (e.b) st.borderBottom = '1px solid #000'; if (e.l) st.borderLeft = '1px solid #000'; if (e.r) st.borderRight = '1px solid #000'; }
        else if (b === 'grid') st.border = '1px solid #8a8a8a';
        else if (b === 'bottom') st.borderBottom = '1px solid #9e9e9e';
        else if (b === 'bottom2') st.borderBottom = '2px solid #000';
        else if (b === 'line') st.borderBottom = '1px solid #000';
      }
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
  const total = Math.round(sh.colWidths.reduce((a, b) => a + b, 0) * PX);
  const table = h('table', { style: { width: total + 'px' } }, colgroup, tbody);
  return h('div', { class: 'sheetwrap', 'data-name': sh.name }, table);
}

function renderModel(model) { return h('div', null, model.sheets.map(sh => renderSheet(sh, model))); }

/** Hides data rows that do not contain the text (used by the search boxes of the report pages). */
function filterRows(container, q) {
  q = (q || '').trim().toLowerCase();
  container.querySelectorAll('tr.data-row').forEach(tr => { tr.style.display = !q || tr.textContent.toLowerCase().includes(q) ? '' : 'none'; });
}

function printModel(model) {
  const root = $('#printRoot');
  root.replaceChildren(renderModel(model));
  const land = !!model.landscape;
  $('#pageStyle').textContent = '@page{size:A4 ' + (land ? 'landscape' : 'portrait') + ';margin:0}';   // margin 0: the browser then prints no URL / date / title in the page margins
  // shrink every sheet to fit one A4 page (width and height) or the page width
  const availW = (land ? 297 : 210) - 16, availH = (land ? 210 : 297) - 18;   // 8 mm padding on each side (set below), 2 mm spare
  const pxW = availW * 96 / 25.4, pxH = availH * 96 / 25.4;
  root.style.cssText = 'display:block;position:absolute;left:-99999px;top:0;visibility:hidden';
  root.querySelectorAll('.sheetwrap').forEach(w => {
    const t = w.firstChild; const sw = t.offsetWidth, sh = t.offsetHeight;
    const k = model.fit === 'width' ? Math.min(1, pxW / sw) : Math.min(1, pxW / sw, pxH / sh);
    w.style.zoom = String(k);
    w.style.padding = (8 / k) + 'mm';   // looks like an 8 mm page margin after the zoom
  });
  root.style.cssText = '';
  document.body.classList.add('printing');
  const done = () => { document.body.classList.remove('printing'); root.replaceChildren(); window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  window.print();
  setTimeout(done, 1500);
}

/** Print / PDF / Excel buttons for a report. getSpec() returns the report request or null. */
function exportBar(getSpec) {
  const mk = (label, fn, customClass) => {
    const b = h('button', { class: 'btn ghost ' + (customClass || ''), type: 'button' }, label);
    b.addEventListener('click', async () => {

  return h('div', { class: 'exportbar' },
    mk('Print', async spec => { printModel(await call('apiGetReportPreview', spec)); }),
    mk('PDF', async spec => { toast('Preparing the PDF. It takes a few seconds.'); downloadB64(await call('apiExportReport', spec, 'pdf')); }, 'btn-pdf'),
    mk('Excel', async spec => { toast('Preparing the Excel file. It takes a few seconds.'); downloadB64(await call('apiExportReport', spec, 'xlsx')); }, 'btn-excel'));
}

async function initLogin() {
  try {
    loginOpts = await api('apiGetLoginOptions');
    const t = $('#lType');
    loginOpts.userTypes.forEach(x => t.appendChild(h('option', { value: x }, x)));
  } catch (e) { loginError(e.message); }
  $('#lType').addEventListener('change', e => { markPh(e.target); fillUsernames(); loginError(''); });
  $('#lUserSel').addEventListener('change', e => markPh(e.target));
  $('#lUserTxt').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 11); });
  $('#lShow').addEventListener('click', () => { const p = $('#lPass'); const show = p.type === 'password'; p.type = show ? 'text' : 'password'; $('#lShow').textContent = show ? 'Hide' : 'Show'; });
  $('#loginForm').addEventListener('submit', async ev => {
    ev.preventDefault(); loginError('');
    const type = $('#lType').value, sa = type === 'School Admin';
    const user = sa ? $('#lUserTxt').value : $('#lUserSel').value, pass = $('#lPass').value;
    if (!type) return loginError('Select user type.');
    if (sa && !/^\d{11}$/.test(user)) return loginError('Type the 11 digit number.');
    if (!sa && !user) return loginError('Select username.');
    if (!pass) return loginError('Enter password.');
    const btn = $('#lGo'); btn.disabled = true; btn.textContent = 'Please wait…';
    try {
      const res = await api('apiLogin', type, user, pass);
      $('#lPass').value = '';
      startSession(res);
    } catch (e) { loginError(e.message); }
    finally { btn.disabled = false; btn.textContent = 'Log in'; }
  });
  const saved = store.get();
  if (saved) {
    try { const r = await api('apiGetSession', saved); startSession({ token: saved, profile: r.profile, menu: r.menu }); }
    catch (e) { store.set(null); }
  }
}

function startSession(res) {
  S.token = res.token; S.profile = res.profile; S.menu = res.menu;
  store.set(S.token);
  $('#login').hidden = true; $('#app').hidden = false;
  $('#whoName').textContent = String(S.profile.displayName || '').replace(/^Zone Admin of\s+/i, 'Admin, ');
  $('#whoRole').textContent = [S.profile.role, S.profile.zoneLabel, S.profile.schoolNo].filter(Boolean).join(' · ');
  renderMenu();
  go('dashboard');
}

function sessionEnded(msg) {
  S.token = null; S.profile = null; S.menu = []; store.set(null);
  $('#app').hidden = true; $('#login').hidden = false; $('#main').replaceChildren();
  loginError(msg || 'Please log in again.');

/** Picks an icon from the menu id (and, for groups, from the label). */
function iconFor(item) {
  const id = String(item.id || ''), base = id.split(':')[0];
  if (base === 'list.create' || base.indexOf('result.create') === 0) return 'create';
  const first = base.split('.')[0];
  if (ICONS[first] && first !== 'dot') return first;
  const l = String(item.label || '').toLowerCase();
  const keys = [['certificate', 'certificates'], ['judgement', 'judgement'], ['chest', 'chest'], ['point', 'score'], ['score', 'score'], ['result', 'result'], ['list', 'list'], ['venue', 'venue'], ['admin', 'admins']];
  for (const k of keys) if (l.indexOf(k[0]) >= 0) return k[1];
  return 'dot';
}

/** Static, built-in SVG only (no user text), so innerHTML is safe here. */
function icon(name) {
  const s = h('span', { class: 'ico', 'aria-hidden': 'true' });
  s.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + (ICONS[name] || ICONS.dot) + '</svg>';
  return s;
}

function menuNode(item, inSub) {
  const lbl = h('span', { class: 'lbl' }, item.label);
  if (!item.children) {
    if (item.locked) {
      // Locked by an admin: stays in the menu, greyed, with a lock sign. Clicking only explains why.
      return h('button', { class: 'mi locked', type: 'button', 'data-id': item.id, 'aria-disabled': 'true', title: item.lockMessage || 'Locked by admin',
        onclick: () => toast(item.lockMessage || 'Locked by admin') }, inSub ? null : icon(iconFor(item)), lbl, icon('lock'));
    }
    return h('button', { class: 'mi' + (S.activeId === item.id ? ' active' : ''), type: 'button', 'data-id': item.id, onclick: () => go(item.id) }, inSub ? null : icon(iconFor(item)), lbl);
  }
  if (item.id === 'list' || item.id === 'result') {
    return h('div', null, h('div', { class: 'mg' }, item.label), item.children.map(c => menuNode(c, false)));
  }
  const sub = h('div', { class: 'sub', hidden: true }, item.children.map(c => menuNode(c, true)));
  const btn = h('button', { class: 'mi caret', type: 'button', onclick: () => { sub.hidden = !sub.hidden; btn.classList.toggle('open', !sub.hidden); } }, icon(iconFor(item)), lbl);
  return h('div', null, btn, sub);
}

function markActive() {
  document.querySelectorAll('#menu .mi[data-id]').forEach(b => {
    const on = b.getAttribute('data-id') === S.activeId;
    b.classList.toggle('active', on);
    if (on) { let p = b.parentElement; while (p && p.id !== 'menu') { if (p.classList.contains('sub') && p.hidden) { p.hidden = false; const c = p.previousElementSibling; if (c) c.classList.add('open'); } p = p.parentElement; } }
  });
}

function findMenuItem(items, id) {
  for (const it of items) {
    if (it.id === id) return it;
    if (it.children) { const r = findMenuItem(it.children, id); if (r) return r; }
  }
  return null;
}

/** The server refused a save because an admin locked this page: refresh the menu and leave the page if it is locked now. */
async function onPageLocked() {
  try { await refreshMenu(); } catch (e) { return; }
  const i = S.activeId.indexOf(':');
  const it = findMenuItem(S.menu, i < 0 ? S.activeId : S.activeId.slice(0, i));
  if (it && it.locked) go('dashboard');
}

async function go(id) {
  if (id === 'logout') return doLogout();
  const i = id.indexOf(':');
  const base = i < 0 ? id : id.slice(0, i), arg = i < 0 ? '' : id.slice(i + 1);
  const menuItem = findMenuItem(S.menu, base);
  if (menuItem && menuItem.locked) { toast(menuItem.lockMessage || 'Locked by admin'); return; }
  S.activeId = id; markActive();
  $('#side').classList.remove('open');
  const fn = PAGES[base];
  if (!fn) { setMain(emptyNote('This page is not available.'), 'Not found'); return; }
  try { await fn(arg); } catch (e) { if (e.code !== 'SESSION_EXPIRED') toast(e.message, 'error'); }
}

  // --- নতুন ফাংশন: বয়স চেক করার ইনস্ট্যান্ট লজিক ---
  function checkAge(group, event, dobIso) {
    if (!ageRules || !ageRules.length) return null; // শিটের ডেটা লোড না হলে চেক করবে না
    if (!dobIso || !group) return null;
    
    let bestRule = null;
    for (let r of ageRules) {
      if (r.group === group) {
        if (r.event === event) { bestRule = r; break; }
        if (r.event === "All" && !bestRule) { bestRule = r; }
      }
    }
    
    if (bestRule) {
      // dobIso এবং শিটের ডেট দুটিই YYYY-MM-DD ফরম্যাটে আছে, তাই ডাইরেক্ট তুলনা!
      if (dobIso < bestRule.start || dobIso > bestRule.end) {
        return "বয়স " + group + " গ্রুপের " + event + " ইভেন্টের নিয়মে পড়ছে না।";
      }
    }
    return null;
  }
  // ------------------------------------------
  // ------------------------------------------

  const sig = r => [r.name, r.father, r.dobIso, r.cls].join('|');
  const dirtyCount = () => rows.filter((r, i) => sig(r) !== orig[i]).length;

  async function guard() { if (dirtyCount() && !(await confirmBox('Unsaved changes', 'You have changes that are not saved. Leave without saving?', 'Leave', 'danger'))) return false; return true; }

  function drawHead() {
    head.replaceChildren();
    if (wide) head.append(h('label', null, 'Zone'), zoneSelect(zoneKey, async v => { if (!(await guard())) { drawHead(); return; } zoneKey = v; S.createZone = v; schoolNo = ''; await loadSchools(); }));
    if (role !== 'School Admin') head.append(h('label', null, 'School'),
      select(schools.map(s => [s.schoolNo, s.schoolNo + ' - ' + s.schoolName + (s.finalSubmitted ? ' (submitted)' : '')]), schoolNo, async v => { if (!(await guard())) { drawHead(); return; } schoolNo = v; await loadSchool(); }));
  }
  async function loadSchools() {
    const z = await busy(() => call('apiGetSchoolsOfZone', zoneKey));
    if (!z) return;
    schools = z.schools;
    if (!schools.some(s => s.schoolNo === schoolNo)) schoolNo = schools.length ? schools[0].schoolNo : '';
    drawHead();
    if (schoolNo) await loadSchool();
  }
  async function loadSchool() {
    area.replaceChildren();
    try {
      const res = await busy(() => call('apiGetSchoolList', schoolNo), true);
      if (!res) throw new Error('x');
      data = res; rows = data.rows.map(r => Object.assign({}, r)); orig = rows.map(sig); draw();
    } catch (e) {
      area.replaceChildren(h('div', { class: 'note' }, role === 'School Admin' ? 'Your list is not open for editing now (it may have been submitted, or Create list is switched off).' : 'This list cannot be opened now.'));
    }
  }
  function applyResult(res) { data = res; rows = res.rows.map(r => Object.assign({}, r)); orig = rows.map(sig); draw(); }

  function draw() {
    const st = data.status;
    const locked = !!st.locked;
    const note = [];
    if (locked) note.push(h('div', { class: 'note bad' }, 'This page is locked by admin. You can look at the list, but you cannot save any change.'));
    if (!st.chestFrozen) note.push(h('div', { class: 'note' }, 'Chest numbers are temporary. They change automatically while schools are still entering data, and become final after every school of the zone does Final Submit. The same student keeps the same chest number in every event.'));
    if (st.finalSubmitted) note.push(h('div', { class: 'note ok' }, 'This list has been submitted (Final Submit).'));
    const tbody = h('tbody');
    rows.forEach((r, i) => {
      const tr = h('tr');
      const mark = () => tr.classList.toggle('dirty', sig(r) !== orig[i]);
      const text = (key, ph) => h('input', { value: r[key], placeholder: ph, maxlength: 60, autocomplete: 'off', disabled: locked,
        oninput: e => { const p = e.target.selectionStart; e.target.value = e.target.value.toUpperCase(); try { e.target.setSelectionRange(p, p); } catch (x) { /* ignore */ } r[key] = e.target.value; mark(); } });
      const dobLabel = h('small', null, fmtDob(r.dobIso));
      
      const dob = h('input', { 
        type: 'date', 
        disabled: locked, 
        value: r.dobIso, 
        min: '2010-01-01', 
        max: new Date().toISOString().slice(0, 10), 
        oninput: e => { 
          const val = e.target.value;
          if (val && val.length === 10) {
             const ageErr = checkAge(r.group, r.event, val);
             if (ageErr) {
               toast('❌ ' + ageErr, 'error');
               e.target.value = '';
               r.dobIso = '';
               dobLabel.textContent = '';
               mark(); 
               return;
             }
          }
          r.dobIso = val; 
          dobLabel.textContent = fmtDob(r.dobIso); 
          mark(); 
        } 
      });

      const cls = select([['', 'Select class']].concat(CLASSES.map(c => [c, c])), r.cls, v => { r.cls = v; mark(); }, { disabled: locked });
      const del = !locked && r.name && orig[i] !== '||||' ? h('button', { class: 'btn ghost small', type: 'button', title: 'Delete this entry',
        onclick: async () => { if (!(await confirmBox('Delete entry', 'Delete ' + r.group + ' ' + r.gender + ' ' + r.event + ' - ' + r.name + '?', 'Delete', 'danger'))) return; const res = await busy(() => call('apiDeleteEntry', schoolNo, r.slot)); if (res) { applyResult(res); toast('Entry deleted', 'ok'); } } }, 'Delete') : null;
      tr.append(h('td', null, i + 1), h('td', null, r.group), h('td', null, r.gender), h('td', null, r.event),
        h('td', null, r.chestNo === '' ? '–' : h('span', { class: 'chest' }, r.chestNo)), h('td', null, text('name', 'Name')), h('td', null, text('father', "Father's name")),
        h('td', null, dob, dobLabel), h('td', null, cls), h('td', null, del));
      tbody.appendChild(tr);
    });
    const table = h('table', { class: 't' }, h('thead', null, h('tr', null,
      ['Sl', 'Group', 'Gender', 'Event'].map(x => h('th', null, x)), h('th', null, 'Chest No ', st.chestFrozen ? null : h('span', { class: 'chip warn' }, 'temporary')),
      ['Name', "Father's Name", 'Date of birth', 'Class', ''].map(x => h('th', null, x)))), tbody);
    const acts = h('div', { class: 'toolbar', style: { marginTop: '12px' } },
      h('button', { class: 'btn', type: 'button', onclick: save }, 'Save'),
      h('button', { class: 'btn gold', type: 'button', onclick: submit }, 'Final Submit'),
      role !== 'School Admin' && st.finalSubmitted ? h('button', { class: 'btn ghost', type: 'button', onclick: reopen }, 'Reopen for correction') : null);
    area.replaceChildren(
      h('div', { class: 'card' }, h('b', null, data.schoolNo + ' · ' + data.schoolName), h('div', null, 'Zone: ' + data.zoneLabel + ' · '),
        h('span', { class: 'chip' }, st.finalSubmitted ? 'Submitted' : 'Not submitted'), ' ', h('span', { class: 'chip' }, st.chestFrozen ? 'Chest numbers final' : 'Chest numbers temporary')),
      ...note, exportBar(() => ({ type: 'school.list', schoolNo })),
      h('div', { class: 'toolbar', style: { marginTop: '8px' } },
        h('button', { class: 'btn', type: 'button', onclick: bulkDownload }, 'Bulk file download'),
        locked ? null : h('button', { class: 'btn', type: 'button', onclick: () => bulkFile.click() }, 'Excel bulk upload'), bulkFile),
      h('div', { class: 'tw' }, table), ...(locked ? [] : [acts]));
  }

  async function save() {
    const entries = rows.map((r, i) => sig(r) !== orig[i] ? { slot: r.slot, name: r.name, father: r.father, dob: r.dobIso, cls: r.cls } : null).filter(Boolean);
    if (!entries.length) return toast('Nothing to save.');
    
    // --- কড়া ভ্যালিডেশন (Save বাটনে ক্লিক করলেই চেক হবে) ---
    for (let r of rows) {
      if (!r.name) continue; 
      
      let eventsOfStudent = rows.filter(row => row.name === r.name && row.dobIso === r.dobIso);
      
      if (eventsOfStudent.length > 2) {
        return toast('❌ ' + r.name + ' সর্বাধিক দু\'টি ইভেন্টে অংশগ্রহণ করতে পারবে।', 'error');
      }
      
      let eventNames = eventsOfStudent.map(e => e.event);
      let hasSpecial = eventNames.includes('YOGA') || eventNames.includes('GYMNASTICS');
      if (hasSpecial && eventNames.length > 1) {
        return toast('❌ ' + r.name + ' YOGA বা GYMNASTICS-এ অংশগ্রহণ করলে অন্য কোনো ইভেন্ট নিতে পারবে না!', 'error');
      }
      
      if (r.dobIso) {
        const ageErr = checkAge(r.group, r.event, r.dobIso);
        if (ageErr) return toast('❌ ' + r.name + ' (' + r.group + '): ' + ageErr, 'error');
      }
    }
    // --- ভ্যালিডেশন শেষ ---
    
    const res = await busy(() => call('apiSaveSchoolList', schoolNo, entries));
    if (res) { applyResult(res); toast('Saved. Chest numbers updated.', 'ok'); }
  }
  const bulkFile = h('input', { type: 'file', accept: '.xlsx', style: { display: 'none' }, onchange: bulkUpload });
  async function bulkDownload() {
    toast('Preparing the Excel file. It takes a few seconds.');
    const res = await busy(() => call('apiExportReport', { type: 'school.list', schoolNo }, 'xlsx'));
    if (res) downloadB64(res);
  }
  async function bulkUpload(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    if (!/\.xlsx$/i.test(file.name)) return toast('Please choose an .xlsx file (the one downloaded with Bulk file download).', 'error');
    if (file.size > 2 * 1024 * 1024) return toast('The file is too big (maximum 2 MB).', 'error');
    if (!(await confirmBox('Excel bulk upload', 'The list of ' + schoolNo + ' will be replaced by the data of this file (' + file.name + '). Rows left empty in the file will be emptied. Continue?', 'Upload', 'blue'))) return;
    const buf = new Uint8Array(await file.arrayBuffer());
    let bin = '';
    for (let k = 0; k < buf.length; k += 8192) bin += String.fromCharCode.apply(null, buf.subarray(k, k + 8192));
    const r = await busyTry(() => call('apiBulkUploadList', schoolNo, btoa(bin)));
    if (!r.ok) { if (r.error.code !== 'SESSION_EXPIRED') toast(r.error.message, 'error'); return; }
    applyResult(r.data);
    toast('Excel uploaded and saved. Chest numbers updated.', 'ok');
  }
  async function submit() {
    if (dirtyCount()) return toast('Please Save your changes first.', 'error');
    
    const msg = role === 'School Admin' 
      ? "Are you sure to Final submit? Once you done it, you won't be able to open/edit it." 
      : "After Final Submit this school can no longer edit (you can reopen it). Do you want to continue?";
      
    if (!(await confirmBox('Final Submit', msg, 'Confirm', 'blue'))) return;
    
    const res = await busy(() => call('apiFinalSubmit', schoolNo));
    if (!res) return;
    toast('List submitted.', 'ok');
    if (role === 'School Admin') { await refreshMenu(); go('dashboard'); } else { await loadSchools(); }
  }
  async function reopen() {
    if (!(await confirmBox('Reopen list', 'Allow ' + schoolNo + ' to edit again?', 'Reopen', 'blue'))) return;
    const res = await busy(() => call('apiReopenList', schoolNo));
    if (res) { toast('List reopened.', 'ok'); await loadSchools(); }
  }

  // পেজ লোড হওয়ার সময়ই বয়স চেকিংয়ের নিয়মগুলো গুগল শিট থেকে লোড করা হচ্ছে 
  // পেজ লোড হওয়ার সময়ই বয়স চেকিংয়ের নিয়মগুলো গুগল শিট থেকে লোড করা হচ্ছে 
  try {
    ageRules = (await busy(() => call('apiGetAgeRules'), true)) || [];
    if (!ageRules.length && role === 'School Admin') {
      toast('⚠️ Age_Rules শিট থেকে ডেটা লোড হয়নি!', 'warn');
    }
  } catch(e) { ageRules = []; }

  if (role === 'School Admin') await loadSchool(); else await loadSchools();
}

/* ====================== Zone list (view), circle / subdivision list, Chest at a Glance, Judgement ====================== */
async function pageZoneList(arg) {
  const wide = isWide();
  let zoneKey = arg || (wide ? (S.viewZone || ZONES[0].key) : S.profile.zone);
  let schoolNo = '', schools = [], all = null;
  const f = { q: '', group: '', gender: '', cls: '' };
  const root = h('div'), head = h('div', { class: 'toolbar' }), area = h('div');
  root.append(head, area);
  setMain(root, 'Zone List - ' + zoneLabel(zoneKey));

  async function loadZone() {
    const z = await busy(() => call('apiGetSchoolsOfZone', zoneKey));
    if (!z) return;
    schools = z.schools; 
    if (!schools.some(s => s.schoolNo === schoolNo)) schoolNo = ''; // 'All schools' ডিফল্ট হিসেবে সেট করা হলো
    all = z; await loadSchool();
  }
  async function loadSchool() {
    const d = await busy(() => call('apiGetZoneList', zoneKey, schoolNo));
    if (d) draw(d);
  }
  async function chestAction(frozen) {
    if (frozen) {
      if (!(await confirmBox('Unfreeze chest numbers', 'Chest numbers will be built again from the first row. Printed sheets will no longer match.', 'Unfreeze', 'danger'))) return;
      let r = await busyTry(() => call('apiUnfreezeChest', zoneKey, false));
      if (!r.ok && r.error.code === 'HAS_RESULTS') {
        if (!(await confirmBox('Results will be cleared', 'Results are already entered for this zone. Unfreezing changes chest numbers, so these results will be cleared. Continue?', 'Clear results and unfreeze', 'danger'))) return;
        r = await busyTry(() => call('apiUnfreezeChest', zoneKey, true));
      }
      if (!r.ok) return toast(r.error.message, 'error');
      toast('Chest numbers unfrozen.', 'ok');
    } else {
      const r = await busyTry(() => call('apiFreezeChest', zoneKey));
      if (!r.ok) return toast(r.error.message, 'error');
      toast('Chest numbers are final now.', 'ok');
    }
    await loadZone();
  }
  function draw(d) {
    head.replaceChildren();
    if (wide) head.append(h('label', null, 'Zone'), zoneSelect(zoneKey, v => { zoneKey = v; S.viewZone = v; schoolNo = ''; setMain(root, 'Zone List - ' + zoneLabel(v)); loadZone(); }));
    
    // ড্রপডাউনে 'All schools' অপশন যোগ করা হলো
    head.append(h('label', null, 'School'), select([['', 'All schools']].concat(schools.map(s => [s.schoolNo, s.schoolNo + ' - ' + s.schoolName + ' (' + s.entries + ')'])), schoolNo, v => { schoolNo = v; loadSchool(); }));
    
    const match = r => (!f.group || r.group === f.group) && (!f.gender || r.gender === f.gender) && (!f.cls || r.cls === f.cls) &&
      (!f.q || [r.name, r.father, r.event, r.chestNo].join(' ').toLowerCase().includes(f.q.toLowerCase()));
      
    const filters = h('div', { class: 'toolbar' },
      h('input', { placeholder: 'Search name, event or chest no', oninput: e => { f.q = e.target.value; fill(); } }),
      select([['', 'All groups'], 'A', 'B', 'C'].map(x => Array.isArray(x) ? x : [x, 'Group ' + x]), f.group, v => { f.group = v; fill(); }),
      select([['', 'All genders'], ['BOYS', 'BOYS'], ['GIRLS', 'GIRLS']], f.gender, v => { f.gender = v; fill(); }),
      select([['', 'All classes']].concat(CLASSES.map(c => [c, c])), f.cls, v => { f.cls = v; fill(); }),
      h('button', { class: 'btn ghost small', type: 'button', onclick: () => { f.q = f.group = f.gender = f.cls = ''; draw(d); } }, 'Clear filters'));
      
    const listContainer = h('div'); // সব স্কুলের টেবিল ধারণ করার জন্য কন্টেইনার
    
    const fill = () => {
      // যতগুলো স্কুল আসবে, সবার জন্য আলাদা কার্ড ও টেবিল তৈরি হবে
      listContainer.replaceChildren(...d.schools.map(school => {
        const tbody = h('tbody');
        tbody.append(...school.rows.map((r, i) => match(r) ? h('tr', null, h('td', null, i + 1), h('td', null, r.group), h('td', null, r.gender), h('td', null, r.event), h('td', null, r.chestNo === '' ? '–' : h('span', { class: 'chest' }, r.chestNo)), h('td', null, r.name), h('td', null, r.father), h('td', null, r.dob), h('td', null, r.cls)) : null));
        
        // যদি ফিল্টারের কারণে কোনো স্কুলের টেবিলে ডেটা না থাকে, তবে সেটি লুকানো থাকবে
        if (!tbody.children.length) return null;
        
        return h('div', { style: { marginBottom: '24px' } }, 
          h('div', { class: 'card', style: { marginBottom: '8px' } }, h('b', null, school.schoolNo + ' · ' + school.schoolName), h('div', null,
            h('span', { class: 'chip' }, school.finalSubmitted ? 'Submitted' : 'Not submitted'))),
          h('div', { class: 'tw' }, h('table', { class: 't' }, h('thead', null, h('tr', null, ['Sl', 'Group', 'Gender', 'Event', 'Chest No', 'Name', "Father's Name", 'DOB', 'Class'].map(x => h('th', null, x)))), tbody))
        );
      }).filter(Boolean));
    };
    
    fill();
    
    area.replaceChildren(
      // জোন লেভেলের স্ট্যাটাস ও চেস্ট নম্বর ফ্রিজ বাটনটি সবার উপরে রাখা হলো
      h('div', { class: 'card' }, h('b', null, 'Zone: ' + d.zoneLabel), h('div', null,
        h('span', { class: 'chip ' + (d.chestFrozen ? '' : 'warn') }, d.chestFrozen ? 'Chest numbers final' : 'Chest numbers temporary'), ' ',
        wide ? h('button', { class: 'btn ghost small', type: 'button', onclick: () => chestAction(d.chestFrozen) }, d.chestFrozen ? 'Unfreeze chest numbers' : 'Freeze chest numbers') : null)),
        
      h('div', { class: 'toolbar' }, 
        schoolNo ? h('b', null, 'This school:') : null, 
        schoolNo ? exportBar(() => ({ type: 'school.list', schoolNo })) : null,
        h('b', null, 'Whole zone:'), exportBar(() => ({ type: 'zone.list', zone: zoneKey }))
      ),
      filters,
      listContainer // পরপর সমস্ত স্কুলের টেবিলগুলো এখানে দেখাবে
    );
  }
  await loadZone();
}

/** Circle list and Subdivision list: preview of the printable pages with a search box. */
function pageModelList(type, title) {
  return async function () {
    const root = h('div'), box = h('div');
    const search = h('input', { placeholder: 'Search in the list', oninput: e => filterRows(box, e.target.value) });
    root.append(h('div', { class: 'toolbar' }, search), exportBar(() => ({ type })), box);
    setMain(root, title);
    const m = await busy(() => call('apiGetReportPreview', { type }));
    if (m) box.replaceChildren(renderModel(m));
  };
}

async function pageGlance() {
  const wide = isWide();
  let level = 'zone', zoneKey = wide ? (S.viewZone || ZONES[0].key) : S.profile.zone;
  const root = h('div'), head = h('div', { class: 'toolbar' }), box = h('div');
  const search = h('input', { placeholder: 'Search chest no, school no or event', oninput: e => filterRows(box, e.target.value) });
  root.append(head, exportBar(() => ({ type: 'chest.glance', level, zone: zoneKey })), box);
  setMain(root, 'Chest at a Glance');
  async function load() {
    head.replaceChildren(h('label', null, 'Show'), select([['zone', 'Zone (school numbers)'], ['circle', 'Circle']], level, v => { level = v; load(); }));
    if (level === 'zone' && wide) head.append(h('label', null, 'Zone'), zoneSelect(zoneKey, v => { zoneKey = v; S.viewZone = v; load(); }));
    head.append(search);
    const m = await busy(() => call('apiGetReportPreview', { type: 'chest.glance', level, zone: zoneKey }));
    if (m) { box.replaceChildren(renderModel(m)); filterRows(box, search.value); }
  }
  await load();
}

async function pageJudgement(arg) {
  const wide = isWide();
  const level = arg === 'CIRCLE' ? 'circle' : 'zone';
  const zoneKey = level === 'zone' ? (arg || S.profile.zone) : '';
  const title = 'Judgement Sheet - ' + (level === 'circle' ? 'Circle' : zoneLabel(zoneKey));
  const root = h('div'), box = h('div');
  const spec = () => ({ type: 'judgement', level, zone: zoneKey });
  root.append(h('div', { class: 'note' }, 'Judgement Sheets are printed after the chest numbers are final. Zone sheets show school numbers, the circle sheet shows zone short names.'),
    exportBar(spec), h('div', { class: 'toolbar' }, h('button', { class: 'btn ghost', type: 'button', onclick: preview }, 'Preview pages')), box);
  setMain(root, title);
  async function preview() {
    try { const m = await busy(() => call('apiGetReportPreview', spec()), true); if (m) box.replaceChildren(renderModel(m)); else throw new Error('x'); }
    catch (e) { box.replaceChildren(h('div', { class: 'note bad' }, 'The Judgement Sheet is not ready yet. ' + (level === 'zone' ? 'Every school of the zone must do Final Submit first.' : 'Circle chest numbers must be frozen first.'))); }
  }
}

/* ====================== Results, points, Create result ====================== */
function pageResultView(level) {
  return async function (arg) {
    const wide = isWide();
    let zoneKey = level === 'zone' ? (arg || S.profile.zone || ZONES[0].key) : '';
    const f = { q: '', group: '', gender: '', event: '', pos: '', all: false };
    const root = h('div');
    const titleMap = {
      zone: 'Zone Result - ' + zoneLabel(zoneKey),
      circle: 'Circle Result',
      subdivision: 'Subdivision Result',
      district: 'District Result',
      state: 'State Level Result'
    };
    const apiMap = {
      zone: () => call('apiGetZoneResults', zoneKey),
      circle: () => call('apiGetCircleResults'),
      subdivision: () => call('apiGetSubdivisionResults'),
      district: () => call('apiGetDistrictResults'),
      state: () => call('apiGetStateResults')
    };
    const showZone = level !== 'zone';
    setMain(root, titleMap[level] || 'Result');
    const d = await busy(apiMap[level]);
    if (!d) return;
    const events = [...new Set(d.rows.map(r => r.event))];
    const tbody = h('tbody');
    const fill = () => {
      let n = 0;
      tbody.replaceChildren(...d.rows.map(r => {
        if (!f.all && !r.declared) return null;
        if (f.group && r.group !== f.group) return null; if (f.gender && r.gender !== f.gender) return null;
        if (f.event && r.event !== f.event) return null; if (f.pos && r.position !== f.pos) return null;

/* ====================== Archive (Multi-Year GitHub CSV + PDF/Excel) ====================== */
// এখানে আপনার চালু হওয়া GitHub Raw লিংকটি বসান (শেষে '/' রাখবেন)
const ARCHIVE_BASE = 'https://raw.githubusercontent.com/asimhub26/sports2026/refs/heads/main/';

const ARCHIVE_YEARS = ['2025'];

const ARCHIVE_ZONES = [
  'Thakuranichak 1', 'Thakuranichak 2', 'Ghoshpur Uttar',
  'Ghoshpur Madhya', 'Ghoshpur Paschim', 'Kishorepur 1', 'Kishorepur 2'
];

const ARCHIVE_CACHE = {};

function parseArchiveCSV(text) {
  text = text.replace(/^\uFEFF/, '');
  const rows = [];
  let row = [], cur = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i], next = text[i + 1];
    if (inQ) {
      if (ch === '"' && next === '"') { cur += '"'; i++; }
      else if (ch === '"') { inQ = false; }
      else { cur += ch; }
    } else {
      if (ch === '"') { inQ = true; }
      else if (ch === ',') { row.push(cur.trim()); cur = ''; }
      else if (ch === '\r' && next === '\n') { row.push(cur.trim()); rows.push(row); row = []; cur = ''; i++; }
      else if (ch === '\n' || ch === '\r') { row.push(cur.trim()); rows.push(row); row = []; cur = ''; }
      else { cur += ch; }
    }
  }
  if (cur !== '' || row.length) { row.push(cur.trim()); rows.push(row); }
  const clean = rows.filter(r => r.some(c => c !== ''));
  if (clean.length < 2) return [];
  const hdrs = clean[0];
  return clean.slice(1).map(r => {
    const o = {};
    hdrs.forEach((k, idx) => { o[k] = r[idx] != null ? r[idx] : ''; });
    return o;
  });
}

async function fetchArchiveCSV(year, prefix) {
  const filename = prefix + '_' + year + '.csv';
  if (ARCHIVE_CACHE[filename]) return ARCHIVE_CACHE[filename];
  const res = await fetch(ARCHIVE_BASE + filename);
  if (res.status === 404) return null;
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = parseArchiveCSV(await res.text());
  ARCHIVE_CACHE[filename] = data;
  return data;
}

function calcArchivePoints(rows, groupField) {
  const map = {};
  rows.forEach(r => {
    const name = (r[groupField] || '').trim();
    if (!name || !r.Name) return;
    const key = name.toUpperCase();
    if (!map[key]) {
      const label = (groupField === 'School' && r['School No']) ? (r['School No'] + ' - ' + name) : name;
      map[key] = { label, first: 0, second: 0, third: 0, points: 0 };
    }
    if (r.Position === '1st') { map[key].first++; map[key].points += 5; }
    else if (r.Position === '2nd') { map[key].second++; map[key].points += 3; }
    else if (r.Position === '3rd') { map[key].third++; map[key].points += 1; }
  });
  const list = Object.values(map).sort((a, b) =>
    b.points - a.points || b.first - a.first || b.second - a.second || b.third - a.third || a.label.localeCompare(b.label)
  );
  list.forEach((item, i) => {
    const prev = list[i - 1];
    const tied = prev && prev.points === item.points && prev.first === item.first && prev.second === item.second && prev.third === item.third;
    item.rank = tied ? prev.rank : (i + 1);
    item.shared = tied;
    if (tied) prev.shared = true;
  });
  return list;
}

function escArchiveHtml(v) {
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function exportArchiveExcel(title, subtitle, cols, rows, filename) {
  if (!rows.length) return;
  let html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">'
    + '<head><meta charset="UTF-8"><style>'
    + 'table{border-collapse:collapse;font-family:Arial,sans-serif;font-size:11pt;}'
    + 'th,td{border:1px solid #444;padding:5px 8px;mso-number-format:"\\@";}'
    + 'th{background:#14532d;color:#fff;font-weight:bold;}'
    + '.ttl{font-size:14pt;font-weight:bold;text-align:center;border:none;padding:6px;}'
    + '.sub{font-size:10pt;text-align:center;border:none;padding:2px 6px 8px;color:#333;}'
    + '</style></head><body><table>'
    + '<tr><td class="ttl" colspan="' + cols.length + '">' + escArchiveHtml(title) + '</td></tr>'

    + rows.map(r => '<tr>' + r.map(v => '<td>' + escArchiveHtml(v) + '</td>').join('') + '</tr>').join('')
    + '</tbody></table></body></html>';

  const blob = new Blob(['\uFEFF' + html], { type: 'application/vnd.ms-excel;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename.replace(/[^a-zA-Z0-9_-]+/g, '_') + '.xls';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
}

let ARCHIVE_PDF_LIBS = null;

function loadScriptTry(urls) {
  return new Promise((resolve, reject) => {
    let i = 0;
    const next = () => {
      if (i >= urls.length) return reject(new Error('Script load failed'));
      const s = document.createElement('script');
      s.src = urls[i++];
      s.onload = resolve;
      s.onerror = () => { s.remove(); next(); };
      document.head.appendChild(s);
    };
    next();
  });
}

function isPdfLibReady() {
  return !!(window.jspdf && window.jspdf.jsPDF && window.jspdf.jsPDF.API && window.jspdf.jsPDF.API.autoTable);
}

function loadArchivePdfLibs() {
  if (isPdfLibReady()) return Promise.resolve();
  if (ARCHIVE_PDF_LIBS) return ARCHIVE_PDF_LIBS;
  ARCHIVE_PDF_LIBS = loadScriptTry([
    'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'
  ]).then(() => loadScriptTry([
    'https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js'
  ])).catch(err => { ARCHIVE_PDF_LIBS = null; throw err; });
  return ARCHIVE_PDF_LIBS;
}

function drawBnCell(pdf, data) {
  const txt = String(data.cell.raw || '').trim();
  if (!txt) return;
  const cw = Math.max(data.cell.width - 2, 4);
  const ch = Math.max(data.cell.height - 1, 3);
  const scale = 10;
  const cv = document.createElement('canvas');
  cv.width = Math.ceil(cw * scale);
  cv.height = Math.ceil(ch * scale);
  const ctx = cv.getContext('2d');
  let fs = Math.min(26, Math.floor(cv.height * 0.62));
  ctx.font = fs + 'px "Noto Sans Bengali", Arial, sans-serif';
  const tw = ctx.measureText(txt).width;
  if (tw > cv.width - 4) {
    fs = Math.max(12, Math.floor(fs * ((cv.width - 4) / tw)));
    ctx.font = fs + 'px "Noto Sans Bengali", Arial, sans-serif';
  }
  ctx.fillStyle = '#111111';
  ctx.textBaseline = 'middle';
  ctx.fillText(txt, 2, cv.height / 2);
  pdf.addImage(cv.toDataURL('image/png'), 'PNG', data.cell.x + 1, data.cell.y + 0.5, cw, ch);
}

function makePdfBtn(onClick) {
  // পেজ খোলার সাথে সাথেই ব্যাকগ্রাউন্ডে লাইব্রেরি রেডি হয়ে থাকবে
  loadArchivePdfLibs().catch(() => {});

  const b = h('button', {
    class: 'btn small',
    type: 'button',
    onclick: () => {
      if (b.disabled) return;
      const run = () => {
        try {
          onClick();
        } catch (err) {
          alert('PDF Error: ' + (err && err.message ? err.message : err));
        }
      };
      if (isPdfLibReady()) {
        run();
      } else {
        const old = b.textContent;
        b.disabled = true;
        b.textContent = 'Loading...';
        loadArchivePdfLibs()
          .then(run)
          .catch(err => alert('PDF লাইব্রেরি লোড হয়নি: ' + (err && err.message ? err.message : err)))
          .finally(() => { b.disabled = false; b.textContent = old; });
      }
    }
  }, 'PDF');
  b.style.cssText = 'background:#dc2626 !important; color:#fff !important; border-color:#dc2626 !important;';
  return b;
}

function exportArchivePDF(title, subtitle, cols, rows, filename, landscape) {
  if (!rows || !rows.length) {
    alert('ডাউনলোড করার মতো কোনো ডেটা নেই।');
    return;
  }
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({
    orientation: landscape ? 'landscape' : 'portrait',
    unit: 'mm',
    format: 'a4'
  });

  const pageW = pdf.internal.pageSize.getWidth();
  const pageH = pdf.internal.pageSize.getHeight();
  const HAS_BN = /[\u0980-\u09FF]/;

  pdf.setFont('helvetica', 'bold');
  pdf.setFontSize(13);
  pdf.setTextColor(20, 83, 45);
  pdf.text(String(title || 'Archive'), pageW / 2, 12, { align: 'center' });

  let startY = 17;
  if (subtitle) {
    pdf.setFont('helvetica', 'normal');
    pdf.setFontSize(9);
    pdf.setTextColor(70);
    pdf.text(String(subtitle), pageW / 2, 17, { align: 'center' });
    startY = 22;
  }

  const bodyRows = rows.map(r => r.map(v => String(v == null ? '' : v)));

  pdf.autoTable({
    startY: startY,
    head: [cols],
    body: bodyRows,
    margin: { left: 8, right: 8, top: 12, bottom: 10 },
    styles: {
      fontSize: 8,
      cellPadding: 2,
      overflow: 'linebreak',
      lineColor: [180, 180, 180],
      lineWidth: 0.2
    },
    headStyles: { fillColor: [20, 83, 45], textColor: 255, fontStyle: 'bold' },
    alternateRowStyles: { fillColor: [248, 250, 252] },
    willDrawCell: function (data) {
      if (data.section === 'body' && HAS_BN.test(String(data.cell.raw || ''))) {
        data.cell.text = [''];
      }
    },
    didDrawCell: function (data) {
      if (data.section === 'body' && HAS_BN.test(String(data.cell.raw || ''))) {
        drawBnCell(pdf, data);
      }
    }
  });

  const total = pdf.internal.getNumberOfPages();
  for (let p = 1; p <= total; p++) {
    pdf.setPage(p);
    pdf.setFontSize(8);
    pdf.setTextColor(100);
    pdf.text('Page ' + p + ' of ' + total, pageW - 8, pageH - 5, { align: 'right' });
  }

  const safeName = (filename || 'Archive_Report').replace(/[^a-zA-Z0-9_-]+/g, '_') + '.pdf';
  const blob = pdf.output('blob');
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = safeName;
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 10000);
}

        ))

    // List ও Result ভিউ

    const showZoneCol = !needZone;
    const f = { q: '', zone: '', group: '', gender: '', event: '', pos: '' };
    const groups = [...new Set(scoped.map(r => r.Group).filter(Boolean))].sort();
    const events = [...new Set(scoped.map(r => r.Event).filter(Boolean))];

      if (f.gender) parts.push('Gender: ' + f.gender);

      if (f.q.trim()) parts.push('Search: ' + f.q.trim());
      parts.push('Total: ' + currentRows.length);

        if (f.group && r.Group !== f.group) return;
        if (f.gender && r.Gender !== f.gender) return;
        if (f.event && r.Event !== f.event) return;
        if (isResult && f.pos && r.Position !== f.pos) return;
        if (f.q && ![r.Name, r["Father's Name"], r.School, r['School No'], r['Chest No'], r.Zone, r.Event].join(' ').toLowerCase().includes(f.q.toLowerCase())) return;
        n++;
        const schoolDisp = (r['School No'] ? r['School No'] + ' - ' : '') + (r.School || '');

        const exportRow = [n, r.Group, r.Gender, r.Event];
        if (isResult) exportRow.push(r.Position);
        exportRow.push(r['Chest No'] || '', r.Name, r["Father's Name"], r.DOB, r.Class, schoolDisp);

          h('td', null, r["Father's Name"]),
          h('td', null, r.DOB),
          h('td', null, r.Class),
          h('td', null, schoolDisp)
        );
        if (showZoneCol) cells.push(h('td', null, r.Zone));
        trs.push(h('tr', null, cells));
      });
      countEl.textContent = 'Showing ' + n + ' of ' + scoped.length;
      if (!trs.length) {
        tbody.replaceChildren(h('tr', null, h('td', { colspan: cols.length }, emptyNote('Data not found.'))));
      } else {
        tbody.replaceChildren(...trs);
      }
    };

    const filters = h('div', { class: 'toolbar' },
      h('input', { placeholder: 'Search name, chest no or school', oninput: e => { f.q = e.target.value; fill(); } }),
      showZoneCol && zonesInData.length > 1 ? select([['', 'All zones']].concat(zonesInData.map(z => [z, z])), '', v => { f.zone = v; fill(); }) : null,
      select([['', 'All groups']].concat(groups.map(g => [g, 'Group ' + g])), '', v => { f.group = v; fill(); }),
      select([['', 'All genders'], ['BOYS', 'BOYS'], ['GIRLS', 'GIRLS']], '', v => { f.gender = v; fill(); }),
      select([['', 'All events']].concat(events.map(e => [e, e])), '', v => { f.event = v; fill(); }),
      isResult ? select([['', 'All positions'], ['1st', '1st'], ['2nd', '2nd'], ['3rd', '3rd']], '', v => { f.pos = v; fill(); }) : null,
     makePdfBtn(() => exportArchivePDF(baseTitle, getSubtitle(), cols, currentRows, fileBase, true)),
      h('button', { class: 'btn small', type: 'button', onclick: () => exportArchiveExcel(baseTitle, getSubtitle(), cols, currentRows, fileBase) }, 'Excel'),
      countEl
    );

    fill();
    area.replaceChildren(
      filters,
      h('div', { class: 'tw' }, h('table', { class: 't' },
        h('thead', null, h('tr', null, cols.map(c => h('th', null, c)))),

/* ====================== Lock / Unlock ====================== */
const LOCK_TEXT = {
  'list.school': ['Lock / Unlock - School Admin (Create list)', 'Tick a school to lock the Create list menu of its School Admin. Remove the tick to open it again.'],
  'list.zone': ['Lock / Unlock - Zone Admin (Create list)', 'Tick a zone to lock the Create list menu of its Zone Admin. Remove the tick to open it again.'],
  'list.circle': ['Lock / Unlock - Circle Admin (Create list)', 'Tick the box to lock the Create list menu of the Circle Admin. Remove the tick to open it again.'],
  'result.zone': ['Lock / Unlock - Create result', 'Tick a zone to lock the Create result menu of its Zone Admin. Remove the tick to open it again.']
};
const LOCK_KIND_TITLE = { 'result.zone': 'Zone Admin - Create result', 'result.circle': 'Circle Admin - Create result' };

function pageLock(page) {
  return async function () {
    const wide = isWide();
    const needZone = page === 'list.school' && wide;
    let zoneKey = needZone ? (S.lockZone || '') : '';
    let data = null, want = {};
    const root = h('div'), head = h('div', { class: 'toolbar' }), area = h('div');
    const title = (page === 'result.zone' && S.profile.role === 'Circle Admin') ? 'Lock / Unlock - Zone Admin (Create result)' : LOCK_TEXT[page][0];
    root.append(head, area);
    setMain(root, title);
    if (needZone) head.append(h('label', null, 'Zone'),
      select([['', 'Choose a zone']].concat(ZONES.map(z => [z.key, z.label])), zoneKey, v => { zoneKey = v; S.lockZone = v; load(); }));

    async function load() {
      area.replaceChildren();
      if (needZone && !zoneKey) { area.append(emptyNote('Choose a zone to see its schools.')); return; }
      const d = await busy(() => call('apiGetLockPage', page, zoneKey));
      if (!d) return;
      data = d; want = {};
      d.items.forEach(it => { want[it.key] = it.locked; });
      draw();
    }

    function draw() {
      const changes = () => data.items.filter(it => it.canChange && want[it.key] !== it.locked);
      const saveBtn = h('button', { class: 'btn', type: 'button', disabled: true, onclick: save }, 'Save');
      const sync = () => { saveBtn.disabled = !changes().length; };
      const boxes = [];
      const kinds = [...new Set(data.items.map(it => it.kind))];
      const rows = [];
      let lastKind = '';
      data.items.forEach(it => {
        if (kinds.length > 1 && it.kind !== lastKind) { rows.push(h('h3', { class: 'sec' }, LOCK_KIND_TITLE[it.kind] || it.kind)); lastKind = it.kind; }
        const cb = h('input', { type: 'checkbox', checked: it.locked, disabled: !it.canChange, 'aria-label': it.label,
          onchange: e => { want[it.key] = e.target.checked; sync(); } });
        boxes.push([it, cb]);
        rows.push(h('label', { class: 'lockrow' + (it.canChange ? '' : ' off') }, cb, h('span', { class: 'lbl' }, it.label),
          it.locked ? h('span', { class: 'chip warn' }, 'Locked' + (it.lockedBy ? ' by ' + it.lockedBy : '')) : h('span', { class: 'chip' }, 'Open'),
          it.canChange ? null : h('small', null, 'Only ' + it.lockedBy + ' or a higher admin can open this.')));
      });
      const setAll = v => { boxes.forEach(([it, cb]) => { if (it.canChange) { cb.checked = v; want[it.key] = v; } }); sync(); };
      area.replaceChildren(h('div', null,
        h('div', { class: 'note' }, LOCK_TEXT[page][1] + ' A locked menu stays visible but greyed, and nothing can be saved there. Click Save after you change the ticks.'),
        data.zoneLabel ? h('div', { class: 'card' }, h('b', null, 'Zone: ' + data.zoneLabel)) : null,
        h('div', { class: 'toolbar' },
          data.items.length > 1 ? h('button', { class: 'btn ghost small', type: 'button', onclick: () => setAll(true) }, 'Tick all') : null,
          data.items.length > 1 ? h('button', { class: 'btn ghost small', type: 'button', onclick: () => setAll(false) }, 'Remove all ticks') : null),
        data.items.length ? h('div', { class: 'card', style: { padding: '0' } }, rows) : emptyNote('Nothing to show.'),
        h('div', { class: 'toolbar' }, saveBtn)));
      sync();

      async function save() {
        const list = changes().map(it => ({ key: it.key, locked: want[it.key] }));
        if (!list.length) return toast('Nothing to save.');
        const r = await busyTry(() => call('apiSaveLocks', page, zoneKey, list));
        if (!r.ok) { if (r.error.code !== 'SESSION_EXPIRED') toast(r.error.message, 'error'); await load(); return; }
        data = r.data; want = {};
        data.items.forEach(it => { want[it.key] = it.locked; });
        draw();
        toast(r.data.changed ? 'Saved. ' + r.data.changed + ' change' + (r.data.changed === 1 ? '' : 's') + '.' : 'Nothing was changed.', 'ok');
      }
    }
    await load();
  };
}

// মেনুবার (#side) এবং ৩-লাইন বাটনের (#burger) বাইরে টাচ করলে মেনু বন্ধ করার কোড
document.addEventListener('click', function (e) {
  const side = document.getElementById('side');
  const burger = document.getElementById('burger');
  const app = document.getElementById('app');
  const content = document.getElementById('content');
  const main = document.getElementById('main');

  if (!side || !burger) return;

  // মেনু বা ৩-লাইন বাটনের ভেতরে টাচ করলে মেনু বন্ধ করবে না
  if (side.contains(e.target) || burger.contains(e.target)) return;

  // বাইরে টাচ করলে মেনু বন্ধ হবে এবং মূল পেজ দৃশ্যমান থাকবে
  side.classList.remove('open', 'show', 'active');
  if (app) app.classList.remove('open', 'menu-open', 'nav-open');
  document.body.classList.remove('open', 'menu-open', 'nav-open');
  if (content) content.hidden = false;
  if (main) main.hidden = false;
});
</script>
